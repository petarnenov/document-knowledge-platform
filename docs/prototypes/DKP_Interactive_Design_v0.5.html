<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DKP · Interactive Design v0.5</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color-scheme:dark;--bg:#10141b;--surface:#191f29;--panel:#212936;--border:#354051;--text:#edf1f7;--muted:#a2afc0;--accent:#6597f7;--good:#52c49a;--warn:#efb55f;--bad:#fa7777}body.light{color-scheme:light;--bg:#f6f8fc;--surface:#fff;--panel:#eef2f8;--border:#d9e0e9;--text:#1b2533;--muted:#5e6c80;--accent:#235cbd;--good:#137653;--warn:#98630b;--bad:#b92e2e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);padding:9px 12px}button.primary{background:var(--accent);color:white;border-color:transparent}button.danger{color:var(--bad)}button:disabled{opacity:.43;cursor:not-allowed}button:hover:not(:disabled){filter:brightness(1.12)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);padding:10px}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}.app{max-width:1420px;min-height:100vh;margin:auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}header{padding:16px 22px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:15px;align-items:center}.brand{font-weight:800;letter-spacing:-.02em}.sub{color:var(--muted);font-size:12px;margin-top:4px}.header-right{display:flex;align-items:center;gap:8px}.badge{display:inline-block;border-radius:25px;border:1px solid var(--border);background:var(--panel);padding:4px 9px;font-size:11px;white-space:nowrap}.badge.good{color:var(--good)}.badge.warn{color:var(--warn)}.badge.bad{color:var(--bad)}.workspace{border-bottom:1px solid var(--border);display:flex;gap:15px;padding:10px 18px;align-items:end}.workspace label{margin:0 0 4px}.workspace>div{flex:1;max-width:350px}.layout{display:flex;min-height:calc(100vh - 130px)}aside{width:215px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:15px 10px;display:flex;flex-direction:column;gap:4px}aside button{width:100%;text-align:left;border:0;background:transparent;padding:11px}aside button.active{background:var(--panel);color:var(--accent);font-weight:700}main{padding:26px;min-width:0;width:100%;max-width:1000px}h1{font-size:26px;margin:7px 0 8px;line-height:1.2}h2{font-size:17px;margin:4px 0 15px}h3{font-size:15px;margin:5px 0 12px}.muted{color:var(--muted)}.small{font-size:13px}.breadcrumbs{font-size:12px;color:var(--muted)}.topline{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--border);border-radius:13px;padding:17px;margin:12px 0;background:var(--surface)}.card .number{font-size:28px;font-weight:750;margin:10px 0 2px}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.row.wrap{flex-wrap:wrap}.row.start{justify-content:flex-start}.rowline{padding:13px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;cursor:pointer}.rowline:last-child{border:0}.rowline:hover{color:var(--accent)}.grow{flex:1;min-width:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.detail{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:11px 0;gap:12px;font-size:14px}.detail:last-child{border:0}.step{display:flex;align-items:center;gap:12px;padding:8px 0}.stepmark{border:1px solid var(--border);width:25px;height:25px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:12px}.stepmark.done{color:var(--good);border-color:var(--good)}.alert{padding:13px;border:1px solid var(--border);border-radius:10px;background:var(--panel);margin:12px 0}.alert.error{color:var(--bad)}.alert.good{color:var(--good)}.preview{min-height:300px;border-radius:10px;background:var(--panel);padding:30px;margin-top:12px}.highlight{background:rgba(228,168,65,.22);border-left:4px solid var(--warn);padding:15px;border-radius:5px}.chips{display:flex;gap:6px;flex-wrap:wrap}.pillbutton.active{background:var(--accent);color:white}.spacer{flex:1}.hidden{display:none}.foot{padding:11px 18px;background:var(--surface);font-size:12px;color:var(--muted);border-top:1px solid var(--border);display:flex;justify-content:space-between}.graph{display:flex;align-items:center;justify-content:space-around;gap:8px;padding:35px 10px;background:var(--panel);border-radius:12px}.graph .node{background:#315fa8;color:white;border-radius:10px;padding:15px}.graph .edge{font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-weight:600}.divider{height:1px;background:var(--border);margin:15px 0}.hint{font-size:12px;color:var(--muted)}@media(max-width:750px){aside{width:62px;padding:10px 5px}aside button{font-size:0;text-align:center}aside button span{font-size:20px}main{padding:16px}.workspace{flex-wrap:wrap}.header-right .badge{display:none}.grid{grid-template-columns:1fr}h1{font-size:22px}}@media(min-width:751px){aside button span{display:inline-block;width:28px}}
</style></head><body><div class="app"><header><div><div class="brand">▦ Document Knowledge</div><div class="sub">Consolidated Interactive Design · v0.5</div></div><div class="header-right"><span class="badge warn">SYNTHETIC DEMO</span><button id="theme">☾ Dark</button></div></header><div class="workspace"><div><label for="workspace">Workspace (isolated synthetic fixtures)</label><select id="workspace"><option value="Acme">Acme Enterprise</option><option value="Northwind">Northwind Labs</option></select></div><div><label for="persona">Demonstration capability perspective</label><select id="persona"><option>Full demo</option><option>Contributor</option><option>Reader</option></select></div></div><div class="layout"><aside id="nav"></aside><main id="main" aria-live="polite"></main></div><div class="foot"><span>DKP · UX prototype v0.5 · Standalone archive</span><span>No backend · No real documents · No persistent storage</span></div></div><script>
const baseline=[{id:'DKP-001',tenant:'Acme',title:'Employee Onboarding Guide',type:'PDF',collection:'People Operations',classification:'Internal',latest:3,active:3,approved:3,stage:'Ready',hold:false,retention:'Active',withdrawn:false,purge:false,excerpt:'Employees complete security orientation before access is provisioned.',page:4},{id:'DKP-002',tenant:'Acme',title:'Information Security Policy',type:'DOCX',collection:'Corporate Policies',classification:'Confidential',latest:2,active:1,approved:0,stage:'Ready',hold:false,retention:'Active',withdrawn:false,purge:false,excerpt:'Access to confidential systems requires approved authorization and periodic review.',page:6},{id:'DKP-003',tenant:'Acme',title:'Platform Architecture Overview',type:'PDF',collection:'Engineering',classification:'Internal',latest:4,active:3,approved:0,stage:'Indexing',hold:false,retention:'Unresolved',withdrawn:false,purge:false,excerpt:'Document management, background processing and knowledge retrieval are separate domains.',page:8},{id:'DKP-004',tenant:'Acme',title:'Quarterly Budget Summary',type:'XLSX',collection:'Finance',classification:'Restricted',latest:0,active:0,approved:0,stage:'Not scheduled',hold:true,retention:'Active',withdrawn:false,purge:false,excerpt:'',page:1},{id:'DKP-005',tenant:'Acme',title:'Product Roadmap 2027',type:'PPTX',collection:'Product',classification:'Internal',latest:1,active:1,approved:1,stage:'Ready',hold:false,retention:'Expired',withdrawn:false,purge:false,excerpt:'The product roadmap organizes phased delivery and release milestones.',page:3},{id:'DKP-006',tenant:'Northwind',title:'Northwind Operations Handbook',type:'PDF',collection:'Operations',classification:'Internal',latest:1,active:1,approved:1,stage:'Ready',hold:false,retention:'Active',withdrawn:false,purge:false,excerpt:'Operational procedures are reviewed before they are released.',page:2}];
const initialCollections=[{id:'C1',tenant:'Acme',name:'People Operations',ceiling:'Internal',members:['DKP-001']},{id:'C2',tenant:'Acme',name:'Corporate Policies',ceiling:'Confidential',members:['DKP-002']},{id:'C3',tenant:'Acme',name:'Engineering',ceiling:'Internal',members:['DKP-003']},{id:'C4',tenant:'Acme',name:'Finance',ceiling:'Restricted',members:['DKP-004']},{id:'C5',tenant:'Acme',name:'Product',ceiling:'Internal',members:['DKP-005']},{id:'C6',tenant:'Northwind',name:'Operations',ceiling:'Internal',members:['DKP-006']}];
let docs=structuredClone(baseline),collections=structuredClone(initialCollections),events=[],s={workspace:'Acme',persona:'Full demo',screen:'home',docId:'DKP-002',collectionId:'C2',filter:'',search:'access',searchMode:'Hybrid',sourceId:'DKP-001',sourcePage:4,draftTitle:'',draftCollection:'Engineering',draftClass:'Internal',fixture:'valid',uploadStep:0,selectedCandidate:'DKP-001',newCollection:'',reason:'',pending:'',conflict:'none',notice:''};
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all=()=>docs.filter(d=>d.tenant===s.workspace),colls=()=>collections.filter(c=>c.tenant===s.workspace),doc=()=>all().find(d=>d.id===s.docId)||all()[0],coll=()=>colls().find(c=>c.id===s.collectionId)||colls()[0];
const status=d=>d.purge?'Purge requested':d.withdrawn?'Withdrawn':!d.latest?'Draft':d.active&&d.active===d.latest?'Published':d.stage!=='Ready'?'Processing':d.approved===d.latest?'Approved':'In review';const published=d=>d.active>0&&!d.withdrawn&&!d.purge;const levels={Internal:1,Confidential:2,Restricted:3};const compatible=d=>colls().filter(c=>c.members.includes(d.id)).every(c=>levels[d.classification]<=levels[c.ceiling]);const hasWrite=()=>s.persona!=='Reader';const admin=()=>s.persona==='Full demo';
const b=(label,action,kind='',disabled=false)=>`<button class="${kind}" ${disabled?'disabled':''} data-action="${action}">${label}</button>`;
const field=(label,value)=>`<div class="detail"><span class="muted">${esc(label)}</span><strong>${esc(value)}</strong></div>`;const badge=(t,k='')=>`<span class="badge ${k}">${esc(t)}</span>`;
const heading=(crumb,title,sub='')=>`<div class="breadcrumbs">${esc(crumb)}</div><h1>${esc(title)}</h1>${sub?`<p class="muted small">${esc(sub)}</p>`:''}`;
const rowDoc=d=>`<div class="rowline" data-open-doc="${d.id}"><span>▤</span><div class="grow"><strong>${esc(d.title)}</strong><div class="sub">${d.id} · ${d.type} · ${esc(d.collection)} · Latest v${d.latest}</div></div>${badge(status(d),published(d)?'good':'')}</div>`;
const steps=(list,step)=>list.map((x,i)=>`<div class="step"><span class="stepmark ${i<step?'done':''}">${i<step?'✓':i+1}</span>${esc(x)}</div>`).join('');
function addEvent(id,action,kind){events.unshift({id:events.length+1,tenant:s.workspace,document:id,action,kind})}function changeDoc(props){Object.assign(doc(),props)}function setScreen(x){s.screen=x;s.pending='';s.notice='';render()}function openDoc(id){s.docId=id;setScreen('detail')}function option(value,text,selected){return `<option value="${esc(value)}" ${selected?'selected':''}>${esc(text)}</option>`}
const docOpts=()=>all().map(d=>option(d.id,d.title,d.id===s.docId)).join('');
const getMain=()=>{let d=doc(),c=coll();switch(s.screen){case'home':return heading('Workspace / Home','Knowledge workspace','A single environment for the document lifecycle.')+`<div class="grid">${[['Documents',all().length],['Published',all().filter(published).length],['Review candidates',all().filter(x=>x.latest>x.active&&x.stage==='Ready').length],['Legal holds',all().filter(x=>x.hold).length]].map(x=>`<div class="card"><div class="muted small">${x[0]}</div><div class="number">${x[1]}</div><div class="sub">Synthetic workspace data</div></div>`).join('')}</div><div class="card"><h2>Quick actions</h2><div class="actions">${b('＋ New document','create','primary')}${b('✓ Reviews','reviews')}${b('⌕ Search','search')}</div></div><div class="card"><h2>Recent documents</h2>${all().map(rowDoc).join('')}</div>`;
case'documents':return heading('Workspace / Documents','Document Library')+`<div class="topline"><div class="grow"><input id="filter" placeholder="Search documents" value="${esc(s.filter)}"></div>${b('＋ New document','create','primary')}</div><div class="card">${all().filter(d=>`${d.title} ${d.id} ${d.collection}`.toLowerCase().includes(s.filter.toLowerCase())).map(rowDoc).join('')||'<p class="muted">No matching documents.</p>'}</div>`;
case'create':return heading('Documents / Create','Create document draft')+`<div class="card"><label>Document title</label><input id="draftTitle" value="${esc(s.draftTitle)}" placeholder="Enter document title"><label>Collection (metadata only)</label><select id="draftCollection">${colls().map(c=>option(c.name,c.name,c.name===s.draftCollection)).join('')}</select><label>Classification · illustrative</label><select id="draftClass">${['Internal','Confidential','Restricted'].map(v=>option(v,v,v===s.draftClass)).join('')}</select><p class="hint">No upload, verified membership, or policy grant is created by this form.</p>${b('Create draft','submitDraft','primary',!hasWrite())}</div>`;
case'detail':return heading('Documents / '+d.id,d.title)+`<div class="chips">${badge(status(d),published(d)?'good':'')}${badge(d.classification)}${badge(d.type)}</div><div class="grid"><div class="card"><div class="muted small">Latest version</div><div class="number">${d.latest||'None'}</div></div><div class="card"><div class="muted small">Active published version</div><div class="number">${d.active||'None'}</div></div></div><div class="toolbar">${b('Upload version','upload','primary',!hasWrite()||d.withdrawn||d.purge)}${b('Processing','processing')}${b('Governance','governance')}${b('Preview','openPreview','',!published(d))}</div><div class="card"><h2>Document details</h2>${field('Lifecycle',status(d))}${field('Collection metadata',d.collection)}${field('Processing',d.stage)}${field('Approved version',d.approved?'v'+d.approved:'None')}${field('Retention',d.retention)}${field('Legal hold',d.hold?'Active':'None (mock)')}</div>`;
case'upload':return heading('Documents / Upload','Add immutable version',d.title)+`<div class="card"><label>Demo file fixture</label><select id="fixture" ${s.uploadStep?'disabled':''}>${[['valid','Valid PDF'],['docx','Valid DOCX'],['pptx','Valid PPTX'],['xlsx','Valid XLSX'],['large','Over 100,000,000 bytes'],['malware','Malware detected'],['scanner','Scanner unavailable']].map(x=>option(x[0],x[1],x[0]===s.fixture)).join('')}</select><div class="alert">Synthetic fixture only — no real transfer or malware scan.</div>${steps(['Transfer','Malware scan','Structural validation','Version recorded'],s.uploadStep)}${s.fixture==='large'&&s.uploadStep===0||['malware','scanner'].includes(s.fixture)&&s.uploadStep===1?'<p class="alert error">Verification blocked by this fixture. No version may be added.</p>':''}<div class="toolbar">${b('Reset','resetUpload')}${s.uploadStep<4?b('Simulate next step','nextUpload','primary',s.fixture==='large'&&s.uploadStep===0||['malware','scanner'].includes(s.fixture)&&s.uploadStep===1):b('Record mock version','finishUpload','primary')}</div></div>`;
case'processing':return heading('Documents / Processing','Processing runs',d.title)+`<div class="chips">${badge('Latest v'+d.latest)}${badge(d.stage,d.stage==='Ready'?'good':'warn')}</div><div class="card"><h2>A. Upload verification</h2>${steps(['Transfer','Malware scan','Structural check','Version committed'],d.latest?4:0)}<p class="hint">Illustrative security history, not a real scan attestation.</p></div><div class="card"><h2>B. Document processing</h2>${steps(['Accepted / dispatch','Parse / OCR','Chunk & source maps','Embeddings','Lexical + vector index'],d.stage==='Ready'?5:0)}<div class="detail"><span>Graph extraction</span><span class="muted">Optional / independent</span></div><div class="detail"><span>Preview generation</span><span class="muted">Independent</span></div>${['Pending dispatch','Indexing'].includes(d.stage)?`<div class="alert">This explicit demo control changes fixture state, not a real background workflow.</div>${b('Apply core-ready fixture','completeProcessing','primary')}`:''}</div>${b('Continue to reviews','reviews')}`;
case'collections':return heading('Workspace / Collections','Knowledge Collections')+colls().map(c=>`<div class="card" data-collection="${c.id}" style="cursor:pointer"><strong>▧ ${esc(c.name)}</strong><div class="sub">${c.members.length} linked · Ceiling ${c.ceiling}</div></div>`).join('')+(c?`<div class="card"><h2>${esc(c.name)}</h2>${c.members.map(id=>{let x=all().find(d=>d.id===id);return `<div class="rowline"><div class="grow" data-open-doc="${id}">${esc(x?.title||id)}</div>${b('Remove','removeMember:'+id,'danger',!hasWrite())}</div>`}).join('')}<label>Add existing document</label><select id="candidate">${all().map(d=>option(d.id,d.title+' · '+d.classification,d.id===s.selectedCandidate)).join('')}</select><div class="toolbar">${b('Add mock membership','addMember','',!hasWrite())}</div><p class="hint">Mock ceiling check is not authorization. Actual audience revision and ACL checks are required.</p></div>`:'')+`<div class="card"><h2>Create collection</h2><input id="newCollection" placeholder="Collection name" value="${esc(s.newCollection)}">${b('Create mock collection','addCollection','primary',!hasWrite())}</div>`;
case'reviews':return heading('Workspace / Reviews','Review & Publication')+`<div class="card"><label>Review candidate</label><select id="docSelect">${all().filter(x=>x.latest).map(x=>option(x.id,x.title,x.id===d.id)).join('')}</select><h3>${esc(d.title)}</h3>${field('Latest version','v'+d.latest)}${field('Current publication',d.active?'v'+d.active:'None')}${field('Core ready',d.stage==='Ready'?'Yes (fixture)':'No')}${field('Approved exact version',d.approved===d.latest?'Yes':'No')}${field('Collection ceiling',compatible(d)?'Compatible (fixture only)':'Incompatible')}<label>Conflict scenario</label><select id="conflict">${[['none','Normal demo state'],['revision','Document revision conflict'],['policy','Policy revision conflict'],['revoked','Permission revoked'],['unavailable','Policy service unavailable']].map(x=>option(x[0],x[1],x[0]===s.conflict)).join('')}</select>${s.conflict!=='none'?'<div class="alert error">Mutation blocked. Server revalidation required.</div>':''}<div class="toolbar">${b('Approve exact version','approve','primary',!hasWrite()||!d.latest||d.stage!=='Ready'||s.conflict!=='none'||d.approved===d.latest)}${b('Publish approved version','publish','',!hasWrite()||d.approved!==d.latest||d.stage!=='Ready'||!compatible(d)||s.conflict!=='none'||d.active===d.latest||d.withdrawn)}</div><p class="hint">Actual approval identity, scan attestations, authorization and audience-revision tokens remain backend responsibilities.</p></div>`;
case'search':{let results=all().filter(d=>published(d)&&d.stage==='Ready'&&`${d.title} ${d.collection} ${d.excerpt}`.toLowerCase().includes(s.search.toLowerCase()));return heading('Workspace / Search','Knowledge Search','Source-first discovery without generated answers.')+`<label>Search knowledge</label><input id="searchInput" value="${esc(s.search)}" placeholder="Search published knowledge"><div class="toolbar">${['Hybrid','Text','Semantic','Graph'].map(x=>`<button class="pillbutton ${s.searchMode===x?'active':''}" data-mode="${x}">${x}</button>`).join('')}</div>${s.searchMode==='Graph'?`<div class="card"><h2>Knowledge graph · Synthetic</h2><div class="graph"><div class="node">Access</div><div class="edge">REQUIRES →</div><div class="node">Authorization</div></div><p class="hint">The graph is static illustration, not real indexed evidence.</p></div>`:''}<div class="card"><h2>Published synthetic matches · ${results.length}</h2>${results.map(x=>`<div class="rowline"><div class="grow"><strong>${esc(x.title)}</strong><div class="sub">${esc(x.excerpt)}</div><div class="sub">Published v${x.active} · Page ${x.page}</div></div>${b('Open citation','citation:'+x.id)}</div>`).join('')||'<p class="muted">No matching published synthetic content.</p>'}<p class="hint">Text, Semantic, and Hybrid use the same local fixture matcher. No actual retrieval engine is connected.</p></div>`}
case'source':{let x=all().find(d=>d.id===s.sourceId);if(!x||!published(x))return heading('Search / Source','Source unavailable')+'<div class="alert error">Source visibility is unavailable in this mock state.</div>';return heading('Search / Citation',x.title)+`<div class="chips">${badge(x.type)}${badge('Published v'+x.active)}${badge('Synthetic content','warn')}</div><div class="card"><div class="topline">${b('← Previous page','prevPage','',s.sourcePage<=1)}<span>Page ${s.sourcePage}</span>${b('Next page →','nextPage')}</div><div class="preview"><h2>${esc(x.title)}</h2><p class="muted">Synthetic source document, not an uploaded artifact.</p><div class="${s.sourcePage===x.page?'highlight':'alert'}">${esc(x.excerpt)}</div>${s.sourcePage===x.page?'<p class="hint">Highlighted citation location · Demo mapping</p>':''}</div></div>`}
case'operations':return heading('Workspace / Operations','Processing operations')+`<div class="card">${all().map(x=>`<div class="rowline" data-process="${x.id}"><span>${x.stage==='Ready'?'✓':'◷'}</span><div class="grow"><strong>${esc(x.title)}</strong><div class="sub">${esc(x.stage)}</div></div><span>›</span></div>`).join('')}</div>`;
case'governance':return heading('Workspace / Governance','Governance & Compliance')+`<label>Selected document</label><select id="docSelect">${docOpts()}</select><div class="card"><h2>Lifecycle constraints</h2>${field('Classification',d.classification)}${field('Published',published(d)?'Active':'Not active')}${field('Retention',d.retention)}${field('Legal hold',d.hold?'Active':'None (demo)')}${field('Deletion',d.purge?'Requested':'No request')}</div><div class="card"><h2>Preservation and withdrawal</h2><div class="toolbar">${b(d.hold?'Release legal hold':'Apply legal hold',d.hold?'request:release':'request:hold','',!admin()||d.purge)}${b('Withdraw publication','request:withdraw','',!admin()||!published(d))}${b('Request controlled purge','request:purge','danger',!admin()||d.hold||d.retention!=='Expired'||!d.withdrawn||d.purge)}</div><p class="hint">Purge requires expired retention, no active legal hold, withdrawn publication and actual policy authorization. No content is ever deleted by this prototype.</p><label>Dependency failure fixture</label><select id="conflict">${[['none','Normal conditions'],['revoked','Permission revoked'],['policy','Policy conflict'],['unavailable','Authority unavailable']].map(x=>option(x[0],x[1],x[0]===s.conflict)).join('')}</select></div>${s.pending?`<div class="card"><h2>Confirm mock ${esc(s.pending)}</h2><label>Reason (required)</label><textarea id="reason" rows="3">${esc(s.reason)}</textarea><div class="toolbar">${b('Cancel','cancel')}${b('Confirm','confirmGovern','primary',!admin()||s.conflict!=='none')}</div></div>`:''}`;
case'audit':return heading('Workspace / Audit','Audit History','In-memory demonstration records only.')+`<div class="card">${events.filter(e=>e.tenant===s.workspace).map(e=>`<div class="rowline" data-open-doc="${e.document}"><div class="grow"><strong>${esc(e.action)}</strong><div class="sub">${e.document} · ${e.kind} · Mock event</div></div>›</div>`).join('')||'<p class="muted">No demo events.</p>'}<p class="hint">These events are not immutable, authoritative or retained audit records.</p></div>`;
default:return heading('Workspace','Unknown view')}};
function render(){document.getElementById('workspace').value=s.workspace;document.getElementById('persona').value=s.persona;document.getElementById('nav').innerHTML=[['home','⌂','Home'],['documents','▤','Documents'],['collections','▧','Collections'],['reviews','✓','Reviews'],['search','⌕','Search'],['operations','◷','Operations'],['governance','♢','Governance'],['audit','◴','Audit']].map(x=>`<button class="${s.screen===x[0]?'active':''}" data-nav="${x[0]}"><span aria-hidden="true">${x[1]}</span> ${x[2]}</button>`).join('')+`<div class="spacer"></div><div class="divider"></div>${b('↺ Reset demo','reset')}`;document.getElementById('main').innerHTML=(s.notice?`<div class="alert">${esc(s.notice)}</div>`:'')+getMain();document.getElementById('theme').textContent=document.body.classList.contains('light')?'☀ Light':'☾ Dark'}
function action(a){let d=doc();s.notice='';if(['create','documents','collections','reviews','search','operations','governance','audit','home','upload','processing'].includes(a)){if(a==='upload'){s.fixture='valid';s.uploadStep=0}setScreen(a);return}switch(true){case a==='reset':docs=structuredClone(baseline);collections=structuredClone(initialCollections);events=[];s.screen='home';s.pending='';s.notice='Demo reset to archived baseline.';break;case a==='submitDraft':{if(!s.draftTitle.trim()||!hasWrite())break;let id='DKP-'+String(Math.max(...docs.map(x=>Number(x.id.split('-')[1])))+1).padStart(3,'0');docs.push({id,tenant:s.workspace,title:s.draftTitle.trim(),type:'PDF',collection:s.draftCollection,classification:s.draftClass,latest:0,active:0,approved:0,stage:'Not scheduled',hold:false,retention:'Unresolved',withdrawn:false,purge:false,excerpt:'',page:1});addEvent(id,'Draft created (mock)','Document');s.docId=id;s.draftTitle='';s.screen='detail';s.notice='Synthetic draft created without file or membership.';break}case a==='resetUpload':s.uploadStep=0;break;case a==='nextUpload':if(s.fixture==='large'&&s.uploadStep===0||['malware','scanner'].includes(s.fixture)&&s.uploadStep===1)break;s.uploadStep=Math.min(4,s.uploadStep+1);break;case a==='finishUpload':if(s.uploadStep<4)break;d.latest++;d.approved=0;d.stage='Pending dispatch';d.type=({docx:'DOCX',xlsx:'XLSX',pptx:'PPTX'}[s.fixture]||'PDF');d.excerpt='Synthetic indexed content for the uploaded version.';d.page=1;addEvent(d.id,'Version '+d.latest+' added (mock)','Document');s.screen='processing';s.notice='Mock immutable version recorded; publication unchanged.';break;case a==='completeProcessing':if(['Pending dispatch','Indexing'].includes(d.stage)){d.stage='Ready';addEvent(d.id,'Core-ready fixture applied','Processing');s.notice='Demo processing state set to Ready. No worker ran.'}break;case a==='approve':if(hasWrite()&&d.stage==='Ready'&&s.conflict==='none'){d.approved=d.latest;addEvent(d.id,'Version '+d.latest+' approved (mock)','Review');s.notice='Mock exact-version approval recorded.'}break;case a==='publish':if(hasWrite()&&d.stage==='Ready'&&s.conflict==='none'&&d.approved===d.latest&&compatible(d)){d.active=d.latest;addEvent(d.id,'Version '+d.latest+' published (mock)','Publication');s.notice='Mock publication pointer activated.'}break;case a==='addMember':{let c=coll(),x=all().find(v=>v.id===s.selectedCandidate);if(!x||!hasWrite())break;if(levels[x.classification]>levels[c.ceiling])s.notice='Blocked: classification exceeds illustrative collection ceiling.';else if(c.members.includes(x.id))s.notice='Document is already a member.';else{c.members.push(x.id);addEvent(x.id,'Mock membership added','Access');s.notice='Membership added locally; no access granted.'}break}case a.startsWith('removeMember:'):{let id=a.split(':')[1];if(hasWrite()){coll().members=coll().members.filter(x=>x!==id);addEvent(id,'Mock membership removed','Access')}break}case a==='addCollection':{if(!s.newCollection.trim()||!hasWrite())break;let id='C'+(collections.length+1);collections.push({id,tenant:s.workspace,name:s.newCollection.trim(),ceiling:'Internal',members:[]});s.collectionId=id;s.newCollection='';s.notice='Mock collection created without audience permissions.';break}case a==='openPreview':s.sourceId=d.id;s.sourcePage=d.page;s.screen='source';break;case a.startsWith('citation:'):{let id=a.split(':')[1],x=all().find(z=>z.id===id);if(!x||!published(x))break;s.sourceId=id;s.sourcePage=x.page;s.screen='source';break}case a==='prevPage':s.sourcePage=Math.max(1,s.sourcePage-1);break;case a==='nextPage':s.sourcePage++;break;case a.startsWith('request:'):s.pending=a.split(':')[1];s.reason='';break;case a==='cancel':s.pending='';s.reason='';break;case a==='confirmGovern':{let p=s.pending;if(!admin()||s.conflict!=='none'||!s.reason.trim())break;if(p==='hold'&&!d.purge)d.hold=true;else if(p==='release'&&d.hold)d.hold=false;else if(p==='withdraw'&&published(d)){d.withdrawn=true;d.active=0}else if(p==='purge'&&!d.hold&&d.retention==='Expired'&&d.withdrawn&&!d.purge)d.purge=true;else break;addEvent(d.id,'Governance '+p+' requested (mock) — '+s.reason,'Governance');s.notice='Mock governance state changed; no real destructive action occurred.';s.reason='';s.pending='';break}}render()}
document.addEventListener('click',e=>{if(e.target.closest('#theme')){document.body.classList.toggle('light');render();return}let el=e.target.closest('[data-action],[data-nav],[data-open-doc],[data-process],[data-collection],[data-mode]');if(!el)return;if(el.dataset.nav)setScreen(el.dataset.nav);else if(el.dataset.openDoc)openDoc(el.dataset.openDoc);else if(el.dataset.process){s.docId=el.dataset.process;setScreen('processing')}else if(el.dataset.collection){s.collectionId=el.dataset.collection;render()}else if(el.dataset.mode){s.searchMode=el.dataset.mode;render()}else if(el.dataset.action)action(el.dataset.action)});
document.addEventListener('input',e=>{const id=e.target.id;if(({filter:'filter',draftTitle:'draftTitle',newCollection:'newCollection',reason:'reason',searchInput:'search'})[id])s[({filter:'filter',draftTitle:'draftTitle',newCollection:'newCollection',reason:'reason',searchInput:'search'})[id]]=e.target.value;if(id==='filter'||id==='searchInput'){const pos=e.target.selectionStart;render();let input=document.getElementById(id);if(input){input.focus();input.setSelectionRange(pos,pos)}}});
document.addEventListener('change',e=>{let id=e.target.id,v=e.target.value;if(id==='workspace'){s.workspace=v;s.docId=v==='Acme'?'DKP-002':'DKP-006';s.collectionId=v==='Acme'?'C2':'C6';s.selectedCandidate=v==='Acme'?'DKP-001':'DKP-006';s.screen='home';s.notice='Switched synthetic workspace fixture. No real auth session exists.'}else if(id==='persona')s.persona=v;else if(id==='docSelect')s.docId=v;else if(id==='fixture')s.fixture=v;else if(id==='candidate')s.selectedCandidate=v;else if(id==='draftCollection')s.draftCollection=v;else if(id==='draftClass')s.draftClass=v;else if(id==='conflict')s.conflict=v;render()});render();
