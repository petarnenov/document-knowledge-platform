  },
  "components": {
    "securitySchemes": {
      "SessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-DKP-SESSION",
        "description": "Opaque Secure HttpOnly host-only server session; never a bearer token."
      },
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Strict per-service issuer, audience, authorized party and signature validation."
      }
    },
    "schemas": {
      "BrowserSession": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "issuer",
          "subject",
          "displayName",
          "tenants",
          "selectedTenant",
          "csrfToken"
        ],
        "properties": {
          "issuer": {
            "type": "string",
            "format": "uri"
          },
          "subject": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "displayName": {
            "type": "string",
            "maxLength": 256
          },
          "tenants": {
            "type": "array",
            "maxItems": 100,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            }
          },
          "selectedTenant": {
            "type": [
              "string",
              "null"
            ],
            "minLength": 1,
            "maxLength": 256
          },
          "csrfToken": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512
          }
        }
      },
      "TenantSelection": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "tenantId"
        ],
        "properties": {
          "tenantId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          }
        }
      },
      "LogoutRequest": {
        "type": "object",
        "additionalProperties": false,
        "maxProperties": 0
      },
      "SecurityContext": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "service",
          "issuer",
          "subject",
          "tenant"
        ],
        "properties": {
          "service": {
            "type": "string",
            "enum": [
              "dm",
              "kb",
              "search"
            ]
          },
          "issuer": {
            "type": "string",
            "format": "uri"
          },
          "subject": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "tenant": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          }
        }
      },
      "SecurityError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code"
        ],
        "properties": {
          "code": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64,
            "pattern": "^[A-Z][A-Z0-9_]*$"
          }
        }
      }
    }
  }
}
