    "/api/v1/security/context/{service}": {
      "get": {
        "operationId": "getDelegatedSecurityContext",
        "tags": [
          "Identity"
        ],
        "summary": "Read verified context through a fixed BFF upstream",
        "security": [
          {
            "SessionCookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Verified safe identity representation.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
