{
  "openapi": "3.1.0",
  "info": {
    "title": "DKP Identity and Browser Boundary",
    "version": "1.0.0",
    "description": "BFF routes use the same-origin HTTPS portal; direct service routes use each independently protected API base URL."
  },
  "servers": [
    {
      "url": "https://localhost:18443",
      "description": "Local HTTPS BFF entry; override for independently deployed domain context endpoint."
    }
  ],
  "tags": [
    {
      "name": "Identity",
      "description": "Verified actor, tenant selection and server session lifecycle."
    }
  ],
  "paths": {
    "/api/v1/session": {
      "get": {
        "operationId": "getSession",
        "tags": [
          "Identity"
        ],
        "summary": "Read the authenticated server session",
        "security": [
          {
            "SessionCookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Verified safe identity representation.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BrowserSession"
                }
              }
            }
          },
          "401": {
            "description": "Safe public error; no identity-provider diagnostics or credentials.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SecurityError"
                }
              }
            }
          },
          "503": {
            "description": "Safe public error; no identity-provider diagnostics or credentials.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SecurityError"
                }
              }
            }
          }
        }
      }
    },
