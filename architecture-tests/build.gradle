dependencies {
    testImplementation platform(rootProject.libs.micronaut.platform)
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation rootProject.libs.archunit.junit5
    testImplementation 'io.micronaut:micronaut-runtime'
    testImplementation project(':workers:structure-inspector')
    testImplementation project(':modules:observability-support')
    testImplementation project(':modules:observability-java-sdk')
    ['domain', 'application', 'adapters-in', 'adapters-out'].each { layer ->
        testImplementation project(":services:dev-logging:${layer}")
    }
    ['document-management', 'knowledge-base', 'knowledge-search', 'browser-bff'].each { service ->
        ['domain', 'application', 'adapters-in', 'adapters-out', 'bootstrap'].each { layer ->
            testImplementation project(":services:${service}:${layer}")
        }
    }
}

// Scan last when these tests are already selected; ordering does not add any test task.
tasks.named('test') {
    mustRunAfter ':services:dev-logging:adapters-out:test', ':services:dev-logging:adapters-in:test',
        ':services:dev-logging:bootstrap:test', ':modules:observability-java-sdk:test'
}

// Build-only tooling stays outside every application distribution and runtime dependency graph.
sourceSets {
    compilerMetadata { java.srcDir rootProject.file('tools/runtime/java') }
}
sourceSets.test.compileClasspath += sourceSets.compilerMetadata.output
sourceSets.test.runtimeClasspath += sourceSets.compilerMetadata.output

tasks.register('compilerMetadataJacocoReport', JacocoReport) {
    dependsOn tasks.named('test')
    executionData.from layout.buildDirectory.file('jacoco/test.exec')
    classDirectories.from sourceSets.compilerMetadata.output.classesDirs
    sourceDirectories.from sourceSets.compilerMetadata.allJava.srcDirs
    reports { xml.required = true; html.required = true }
}
tasks.register('compilerMetadataCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('compilerMetadataJacocoReport')
    executionData.from layout.buildDirectory.file('jacoco/test.exec')
    classDirectories.from sourceSets.compilerMetadata.output.classesDirs
    violationRules { rule { limit { counter = 'LINE'; minimum = 0.75 }; limit { counter = 'BRANCH'; minimum = 0.75 } } }
}
tasks.named('check') { dependsOn 'compilerMetadataCoverageVerification' }
