server {
    # OAuth callbacks carry credentials in query parameters. The image's inherited
    # request/referrer logs and upstream-error request lines are unsafe here.
    access_log off;
    error_log /dev/null;
    listen 8080;
    listen 20443 ssl;
    server_name _;
    ssl_certificate /run/dkp/portal.crt;
    ssl_certificate_key /run/dkp/portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location ~ ^/api/v1/kb(/|$) {
        proxy_pass http://browser-bff:8080;
        proxy_set_header Host localhost:20443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host localhost:20443;
        proxy_set_header X-Forwarded-Port 20443;
        proxy_set_header Forwarded "";
        # KB BFF operation deadline9s; edge stays outside it.
        proxy_read_timeout 10s;
        proxy_connect_timeout 3s;
        proxy_buffering off;
        client_max_body_size 16k;
        # KB mirrors already emit these; expose one canonical edge pair.
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location ~ ^/(api|oauth|login|logout)(/|$) {
        proxy_pass http://browser-bff:8080;
        proxy_set_header Host localhost:20443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host localhost:20443;
        proxy_set_header X-Forwarded-Port 20443;
        proxy_set_header Forwarded "";
        # KB BFF operation deadline9s; edge stays outside it.
        proxy_read_timeout 10s;
        proxy_connect_timeout 3s;
        proxy_buffering off;
        client_max_body_size 16k;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
