worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    # Never log URI/query/header/cookie/body/referrer data; API producer wiring remains open.
    log_format safe_json escape=json '{"component":"nginx","time":"$time_iso8601","method":"$request_method","status":$status,"requestId":"$request_id","upstreamStatus":"$upstream_status","seconds":"$request_time"}';
    access_log /dev/stdout safe_json;
    server_tokens off;
    include /run/dkp/gateway/server.conf;
}
