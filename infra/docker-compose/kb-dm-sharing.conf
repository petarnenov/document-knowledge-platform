# Private transport adapter only. Application layers enforce exact wire schemas,
# 32KiB complete-response bound and total deadlines; read_timeout is inactivity.
server {
    listen 8080;
    access_log off;
    error_log /dev/null;
    location = /health { return 200; }
    location / { return 404; }
}
server {
    listen 8443 ssl;
    server_name dm-sharing;
    access_log off;
    error_log /dev/null;
    ssl_certificate /run/dkp/dm-tls/server.crt;
    ssl_certificate_key /run/dkp/dm-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    client_body_timeout 1500ms;
    location = /health/readiness {
        if ($request_method != GET) { return 405; }
        if ($is_args != "") { return 400; }
        if ($content_length !~ "^(|0)$") { return 400; }
        if ($http_transfer_encoding != "") { return 400; }
        proxy_pass http://document-management:8080/health/readiness;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host document-management;
        proxy_set_header Accept application/json;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 500ms;
        proxy_send_timeout 500ms;
        proxy_read_timeout 500ms;
        proxy_next_upstream off;
        proxy_buffer_size 2k;
        proxy_buffers 2 2k;
        proxy_busy_buffers_size 2k;
        proxy_max_temp_file_size 0;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Location;
        add_header Cache-Control no-store always;
    }
    location ~ ^/api/v1/documents/knowledge-share-(assessments|eligibility)$ {
        if ($request_method != POST) { return 405; }
        if ($is_args != "") { return 400; }
        if ($request_uri ~ "%|//") { return 400; }
        proxy_pass http://document-management:8080;
        proxy_pass_request_headers off;
        proxy_set_header Host document-management;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-DKP-Tenant $http_x_dkp_tenant;
        proxy_set_header Content-Type application/json;
        proxy_set_header Accept application/json;
        proxy_set_header Connection "";
        proxy_connect_timeout 1500ms;
        proxy_send_timeout 1500ms;
        proxy_read_timeout 1500ms;
        proxy_next_upstream off;
        proxy_request_buffering on;
        client_body_buffer_size 16k;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 2 16k;
        proxy_busy_buffers_size 16k;
        proxy_max_temp_file_size 0;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Location;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { return 404; }
}
