server {
    # OAuth callbacks carry credentials in query parameters. The image's inherited
    # request/referrer logs and upstream-error request lines are unsafe here.
    access_log off;
    error_log /dev/null;
    listen 8080;
    listen 18443 ssl;
    server_name _;
    ssl_certificate /run/dkp/portal.crt;
    ssl_certificate_key /run/dkp/portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location ~ ^/(api|oauth|login|logout)(/|$) {
        proxy_pass http://browser-bff:8080;
        proxy_set_header Host localhost:18443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host localhost:18443;
        proxy_set_header X-Forwarded-Port 18443;
        proxy_set_header Forwarded "";
        proxy_read_timeout 10s;
        proxy_connect_timeout 3s;
        proxy_buffering off;
        client_max_body_size 4k;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
