proxy_set_header Host localhost:__PORTAL_PORT__;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host localhost:__PORTAL_PORT__;
proxy_set_header X-Forwarded-Port __PORTAL_PORT__;
proxy_set_header Forwarded "";
proxy_connect_timeout 1s;
proxy_send_timeout 5s;
proxy_read_timeout 7s;
proxy_buffering off;
proxy_request_buffering off;
client_max_body_size 32768;
add_header Cache-Control no-store always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
