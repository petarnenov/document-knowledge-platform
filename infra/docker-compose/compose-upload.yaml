# Isolated BP03 project. Merge after compose.yaml; !override requires modern Compose.
# Generate NEW identity material with --portal-port 19443 --idp-port 19444;
# pass its runtime.env using --env-file. Provider endpoints/files are mandatory,
# supplied by the separately verified RustFS/scanner/inspector runtime orchestration.
name: dkp-bp03

x-upload-identity: &upload-identity
  OIDC_ISSUER: https://idp.localhost:${DKP_IDP_PORT:?Run BP03 identity bootstrap}/realms/dkp
  OIDC_STANDALONE_ISSUER: https://idp.localhost:${DKP_IDP_PORT:?Run BP03 identity bootstrap}/realms/dkp
  OIDC_JWKS_URL: https://idp.localhost:${DKP_IDP_PORT:?Run BP03 identity bootstrap}/realms/dkp/protocol/openid-connect/certs

services:
  document-management:
    networks: !override [default, dm-data, upload-data]
    ports: !override ["127.0.0.1:19081:8080"]
    environment:
      <<: *upload-identity
      DKP_DM_UPLOAD_ENABLED: "true"
      DKP_DM_STORAGE_ENDPOINT: ${DKP_UPLOAD_STORAGE_ENDPOINT:?Set verified private HTTPS RustFS endpoint}
      DKP_DM_STORAGE_REGION: ${DKP_UPLOAD_STORAGE_REGION:?Set verified RustFS region}
      DKP_DM_STORAGE_ACCESS_KEY_PATH: /run/dkp/storage/access.key
      DKP_DM_STORAGE_SECRET_KEY_PATH: /run/dkp/storage/secret.key
      DKP_DM_STORAGE_CA_PATH: /run/dkp/storage/ca.crt
      DKP_DM_UPLOAD_PRIVATE_SPOOL_PATH: /var/lib/dkp/uploads
      DKP_DM_SCANNER_HOST: ${DKP_UPLOAD_SCANNER_HOST:?Set private standard-definition ClamAV host}
      DKP_DM_SCANNER_PORT: ${DKP_UPLOAD_SCANNER_PORT:?Set private ClamAV port}
      DKP_DM_SCANNER_DEFINITIONS_PATH: /var/lib/clamav
      DKP_DM_INSPECTOR_ENDPOINT: ${DKP_UPLOAD_INSPECTOR_ENDPOINT:?Set verified private HTTPS inspector endpoint}
      DKP_DM_INSPECTOR_KEY_PATH: /run/dkp/inspector/service.key
      DKP_DM_INSPECTOR_CA_PATH: /run/dkp/inspector/ca.crt
      DKP_DM_INSPECTOR_PROFILE_DIGEST: ${DKP_UPLOAD_INSPECTOR_PROFILE_DIGEST:?Set verified inspection profile digest}
      DKP_DM_INSPECTOR_IMAGE_DIGEST: ${DKP_UPLOAD_INSPECTOR_IMAGE_DIGEST:?Set actual inspected worker image digest}
    volumes: !override
      - ${DKP_UPLOAD_SECURITY_DIRECTORY:-../../local-data/security/bp03-upload/identity}/authority:/run/dkp/authority:ro
      - ${DKP_UPLOAD_SECURITY_DIRECTORY:-../../local-data/security/bp03-upload/identity}/truststore.p12:/run/dkp/truststore.p12:ro
      - ${DKP_UPLOAD_SECURITY_DIRECTORY:-../../local-data/security/bp03-upload/identity}/java-security.options:/run/dkp/java-security.options:ro
      # Deliberately mount only application authority, never CA/server/root private keys.
      - ${DKP_UPLOAD_STORAGE_ACCESS_KEY_FILE:?Set application-only RustFS access key file}:/run/dkp/storage/access.key:ro
      - ${DKP_UPLOAD_STORAGE_SECRET_KEY_FILE:?Set application-only RustFS secret key file}:/run/dkp/storage/secret.key:ro
      - ${DKP_UPLOAD_STORAGE_CA_FILE:?Set RustFS public CA file}:/run/dkp/storage/ca.crt:ro
      - ${DKP_UPLOAD_SPOOL_DIRECTORY:?Set owned private upload spool directory}:/var/lib/dkp/uploads
      - ${DKP_UPLOAD_DEFINITIONS_DIRECTORY:?Set immutable verified definition generation}:/var/lib/clamav:ro
      - ${DKP_UPLOAD_INSPECTOR_KEY_FILE:?Set inspector service key file}:/run/dkp/inspector/service.key:ro
      - ${DKP_UPLOAD_INSPECTOR_CA_FILE:?Set inspector public CA file}:/run/dkp/inspector/ca.crt:ro
  knowledge-base:
    ports: !override ["127.0.0.1:19082:8080"]
    environment: *upload-identity
    volumes: !override
      - ${DKP_UPLOAD_SECURITY_DIRECTORY:-../../local-data/security/bp03-upload/identity}/truststore.p12:/run/dkp/truststore.p12:ro
      - ${DKP_UPLOAD_SECURITY_DIRECTORY:-../../local-data/security/bp03-upload/identity}/java-security.options:/run/dkp/java-security.options:ro
  knowledge-search:
    ports: !override ["127.0.0.1:19083:8080"]
    environment: *upload-identity
    volumes: !override
      - ${DKP_UPLOAD_SECURITY_DIRECTORY:-../../local-data/security/bp03-upload/identity}/truststore.p12:/run/dkp/truststore.p12:ro
      - ${DKP_UPLOAD_SECURITY_DIRECTORY:-../../local-data/security/bp03-upload/identity}/java-security.options:/run/dkp/java-security.options:ro
  browser-bff:
    environment:
      <<: *upload-identity
      DKP_PORTAL_ORIGIN: https://localhost:${DKP_PORTAL_PORT:?Run BP03 identity bootstrap}
      OIDC_CALLBACK_URI: https://localhost:${DKP_PORTAL_PORT:?Run BP03 identity bootstrap}/oauth/callback/keycloak
    volumes: !override
      - ${DKP_UPLOAD_SECURITY_DIRECTORY:-../../local-data/security/bp03-upload/identity}/truststore.p12:/run/dkp/truststore.p12:ro
      - ${DKP_UPLOAD_SECURITY_DIRECTORY:-../../local-data/security/bp03-upload/identity}/java-security.options:/run/dkp/java-security.options:ro
  admin-portal:
    ports: !override ["127.0.0.1:${DKP_PORTAL_PORT:?Run BP03 identity bootstrap}:${DKP_PORTAL_PORT:?Run BP03 identity bootstrap}"]
    volumes: !override
      - ${DKP_UPLOAD_SECURITY_DIRECTORY:-../../local-data/security/bp03-upload/identity}/portal.crt:/run/dkp/portal.crt:ro
      - ${DKP_UPLOAD_SECURITY_DIRECTORY:-../../local-data/security/bp03-upload/identity}/portal.key:/run/dkp/portal.key:ro
      - ./nginx-upload.conf:/etc/nginx/conf.d/default.conf:ro
  keycloak:
    # Matching internal listener is essential: idp.localhost resolves on this network.
    ports: !override ["127.0.0.1:${DKP_IDP_PORT:?Run BP03 identity bootstrap}:${DKP_IDP_PORT:?Run BP03 identity bootstrap}"]
    environment:
      KC_HOSTNAME: https://idp.localhost:${DKP_IDP_PORT:?Run BP03 identity bootstrap}
      KC_HTTPS_PORT: ${DKP_IDP_PORT:?Run BP03 identity bootstrap}
    volumes: !override
      - ${DKP_UPLOAD_SECURITY_DIRECTORY:-../../local-data/security/bp03-upload/identity}/idp.crt:/run/dkp/idp.crt:ro
      - ${DKP_UPLOAD_SECURITY_DIRECTORY:-../../local-data/security/bp03-upload/identity}/idp.key:/run/dkp/idp.key:ro
      - ${DKP_UPLOAD_SECURITY_DIRECTORY:-../../local-data/security/bp03-upload/identity}/dkp-realm.json:/opt/keycloak/data/import/dkp-realm.json:ro

  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    user: "${DKP_LOCAL_UID}:${DKP_LOCAL_GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    tmpfs: ["/tmp:uid=${DKP_LOCAL_UID},gid=${DKP_LOCAL_GID},mode=0700,size=64m"]
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/private/root-access
      RUSTFS_SECRET_KEY_FILE: /run/private/root-secret
      RUSTFS_TLS_PATH: /run/private
      RUSTFS_CHECK_UPDATE: "false"
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - ${DKP_UPLOAD_RUSTFS_SERVER_DIRECTORY:?Prepare private RustFS server authority}:/run/private:ro
      - ${DKP_UPLOAD_RUSTFS_DATA_DIRECTORY:?Prepare owned RustFS data directory}:/data
      - ${DKP_UPLOAD_STORAGE_CA_FILE:?Set RustFS public CA file}:/run/dkp/ca.crt:ro
    networks: [upload-data]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "2", --cacert, /run/dkp/ca.crt, https://localhost:9000/health]
      interval: 5s
      timeout: 3s
      retries: 12

  clamav:
    image: clamav/clamav:1.5.4@sha256:bda39705e291105049c3936e2803ac90b955172af8030f94f05dce1252df6c6d
    user: "100:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    cpus: 2
    pids_limit: 64
    tmpfs: ["/tmp:uid=100,gid=101,mode=0700,size=1g"]
    entrypoint: [clamd]
    command: ["--config-file=/run/dkp/clamd.conf"]
    volumes:
      - ${DKP_UPLOAD_DEFINITIONS_DIRECTORY:?Set immutable verified definition generation}:/var/lib/clamav:ro
      - ./clamd.conf:/run/dkp/clamd.conf:ro
    networks: [upload-data]
    healthcheck:
      test: [CMD, clamdscan, "--config-file=/run/dkp/clamd.conf", "--ping=1"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 12

  inspector-network:
    image: dkp-bp03-inspector-network:local
    pull_policy: never
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 16
    tmpfs: ["/tmp:uid=0,gid=0,mode=0700,size=1m"]
    networks:
      upload-data:
        aliases: [structure-inspector]

  structure-inspector:
    image: ${DKP_UPLOAD_INSPECTOR_CONTAINER_IMAGE:?Set actual verified worker image}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=0700,size=1g"]
    network_mode: service:inspector-network
    depends_on:
      inspector-network: {condition: service_healthy}
    environment:
      DKP_INSPECTOR_KEYSTORE_PATH: /run/dkp/inspector/server.p12
      DKP_INSPECTOR_KEYSTORE_PASSWORD_PATH: /run/dkp/inspector/keystore.password
      DKP_INSPECTOR_SERVICE_KEY_PATH: /run/dkp/inspector/service.key
      DKP_INSPECTOR_TEMP_DIR: /tmp
    volumes:
      - inspector-authority:/run/dkp/inspector:ro

networks:
  upload-data:
    internal: true
volumes:
  inspector-authority:
    external: true
    name: ${DKP_UPLOAD_INSPECTOR_AUTHORITY_VOLUME:?Set prepared worker-only authority volume}
