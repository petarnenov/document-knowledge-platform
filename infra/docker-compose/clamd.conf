# The scanner and DM mount the same published definition generation read-only.
# Only an independent one-shot FreshClam staging job has update/network authority.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
PidFile /tmp/clamd.pid
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 2
MaxQueue 4
MaxConnectionQueueLength 8
StreamMaxLength 100000000
MaxFileSize 100000000
MaxScanSize 1000000000
MaxScanTime 120000
MaxRecursion 16
MaxFiles 10000
ReadTimeout 30
CommandReadTimeout 5
AlertExceedsMax yes
AlertEncrypted yes
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
Bytecode yes
ConcurrentDatabaseReload no
SelfCheck 0
LogTime yes
LogClean no
LogVerbose no
