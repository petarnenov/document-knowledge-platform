# BP03 isolated development edge. Actual backend deadlines remain authoritative.
server {
    access_log off;
    error_log /dev/null;
    listen 8080;
    listen 19443 ssl;
    server_name _;
    ssl_certificate /run/dkp/portal.crt;
    ssl_certificate_key /run/dkp/portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_body_timeout 30s;
    send_timeout 30s;

    # Only the authenticated fixed upload-content route accepts the binary budget.
    location ~ "^/api/v1/dm/documents/uploads/[0-9a-fA-F-]{36}/content$" {
        client_max_body_size 100000000;
        proxy_read_timeout 305s;
        error_page 413 = @upload_too_large;
        error_page 502 504 = @upload_unavailable;
        proxy_pass http://browser-bff:8080;
        proxy_set_header Host localhost:19443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host localhost:19443;
        proxy_set_header X-Forwarded-Port 19443;
        proxy_set_header Forwarded "";
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_intercept_errors off;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    # Verification has a240s whole-exchange backend deadline. JSON remains16KiB.
    location ~ "^/api/v1/dm/documents/uploads(?:/|$)" {
        client_max_body_size 16384;
        proxy_read_timeout 245s;
        error_page 413 = @upload_too_large;
        error_page 502 504 = @upload_unavailable;
        proxy_pass http://browser-bff:8080;
        proxy_set_header Host localhost:19443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host localhost:19443;
        proxy_set_header X-Forwarded-Port 19443;
        proxy_set_header Forwarded "";
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_intercept_errors off;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location ~ "^/api/v1/dm/documents/[0-9a-fA-F-]{36}/(?:versions|versions/[0-9a-fA-F-]{36}/content|upload-receipts/[0-9a-fA-F-]{36}/version)$" {
        client_max_body_size 16384;
        proxy_read_timeout 30s;
        error_page 413 = @upload_too_large;
        error_page 502 504 = @upload_unavailable;
        proxy_pass http://browser-bff:8080;
        proxy_set_header Host localhost:19443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host localhost:19443;
        proxy_set_header X-Forwarded-Port 19443;
        proxy_set_header Forwarded "";
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_intercept_errors off;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location ~ "^/(api|oauth|login|logout)(/|$)" {
        client_max_body_size 16384;
        proxy_read_timeout 10s;
        proxy_pass http://browser-bff:8080;
        proxy_set_header Host localhost:19443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host localhost:19443;
        proxy_set_header X-Forwarded-Port 19443;
        proxy_set_header Forwarded "";
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_intercept_errors off;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location @upload_too_large {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        return 413 '{"code":"PAYLOAD_TOO_LARGE"}';
    }
    location @upload_unavailable {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        return 503 '{"code":"UNAVAILABLE"}';
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
