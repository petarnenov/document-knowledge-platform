    location = /dev/logs {
        if ($viewer_origin_allowed = 0) { return 403; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        alias /usr/share/nginx/html/logs.html;
        default_type text/html;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'" always;
    }
    location = /dev/logs/ {
        if ($viewer_origin_allowed = 0) { return 403; }
        return 308 /dev/logs;
    }
    location = /logs.html { return 404; }
    location = /dev/logs/api/v1/events {
        set $viewer http://viewer:18088;
        proxy_pass $viewer;
        include /run/dkp/gateway/log-proxy.conf;
    }
    location ^~ /dev/logs/ { return 404; }
