rootProject.name = 'document-knowledge-platform'

def services = ['document-management', 'knowledge-base', 'knowledge-search', 'browser-bff']
services.each { service ->
    ['domain', 'application', 'adapters-in', 'adapters-out', 'bootstrap'].each { layer ->
        include ":services:${service}:${layer}"
    }
}
include 'architecture-tests'
include 'generated-clients:java'

include 'modules:identity-contracts'
include 'modules:security-micronaut'
include 'modules:authorization-catalog'
include 'modules:observability-support'
include 'workers:structure-inspector'

// The logging boundary is assembled incrementally; HTTP/bootstrap wiring follows its contracts.
['domain', 'application', 'adapters-in', 'adapters-out', 'bootstrap'].each { layer ->
    include ":services:dev-logging:${layer}"
}
