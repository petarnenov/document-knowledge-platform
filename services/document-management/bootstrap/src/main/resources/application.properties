micronaut.application.name=document-management
micronaut.server.port=8080
micronaut.server.host=0.0.0.0
micronaut.server.netty.worker.threads=2
micronaut.server.netty.parent.threads=1
endpoints.all.enabled=false

# Protected capability stays closed unless the complete trusted profile is supplied.
dkp.security.mode=resource
dkp.security.profile=${OIDC_PROFILE:unconfigured}
dkp.security.issuer=${OIDC_ISSUER:}
dkp.security.standalone-issuer=${OIDC_STANDALONE_ISSUER:}
dkp.security.audience=dkp-dm
dkp.security.authorized-parties=${OIDC_AUTHORIZED_PARTIES:}
dkp.security.jwks-url=${OIDC_JWKS_URL:}
dkp.security.jwks-lease-seconds=30
dkp.security.timeout-millis=2000
micronaut.security.authentication=bearer
micronaut.security.token.jwt.signatures.jwks.dkp.url=${OIDC_JWKS_URL:}
micronaut.security.token.jwt.claims-validators.issuer=${OIDC_ISSUER:}
micronaut.security.token.jwt.claims-validators.audience=dkp-dm
micronaut.security.token.jwt.claims-validators.expiration=true
micronaut.security.token.jwt.claims-validators.not-before=true
micronaut.http.services.dkp.follow-redirects=false
micronaut.http.services.dkp.connect-timeout=2s
micronaut.http.services.dkp.read-timeout=2s
micronaut.http.services.dkp.max-content-length=131072
logger.levels.io.micronaut.security.token.jwt=INFO
micronaut.security.endpoints.login.enabled=false
micronaut.security.endpoints.logout.enabled=false
