tasks.register('realScannerAcceptance', JavaExec) {
    group = 'verification'
    description = 'Requires actual ClamAV and the same read-only standard-definition generation.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.documentknowledge.documentmanagement.adapters.outbound.verification.RealScannerAcceptance'
    jvmArgs '-XX:ActiveProcessorCount=2'
    doFirst {
        args = ['dkpScannerHost', 'dkpScannerPort', 'dkpScannerDefinitions'].collect { key ->
            def value = providers.gradleProperty(key).orNull
            if (!value) throw new GradleException("Explicit real-scanner property required: ${key}")
            value
        }
    }
}

tasks.register('realInspectorAcceptance', JavaExec) {
    group = 'verification'
    description = 'Requires the actual isolated TLS inspector, pinned profile/image and four real format fixtures.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.documentknowledge.documentmanagement.adapters.outbound.verification.RealInspectorAcceptance'
    jvmArgs '-XX:ActiveProcessorCount=2'
    doFirst {
        args = ['dkpInspectorEndpoint', 'dkpInspectorCa', 'dkpInspectorKey',
                'dkpInspectorProfile', 'dkpInspectorImage', 'dkpInspectorFixtures'].collect { key ->
            def value = providers.gradleProperty(key).orNull
            if (!value) throw new GradleException("Explicit real-inspector property required: ${key}")
            value
        }
    }
}

// Required explicit acceptance profile: never skip missing real provider authority.
tasks.register('realUploadPersistenceStorageAcceptance', JavaExec) {
    group = 'verification'
    description = 'Runs all COPY/FENCE cases against actual PostgreSQL, private RustFS, ClamAV and isolated TLS inspection.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.documentknowledge.documentmanagement.adapters.outbound.upload.RealUploadPersistenceStorageAcceptance'
    jvmArgs '-XX:ActiveProcessorCount=2'
    def authorityTmp = layout.buildDirectory.dir('authority-test-tmp')
    systemProperty 'java.io.tmpdir', authorityTmp.get().asFile.absolutePath
    doFirst { authorityTmp.get().asFile.mkdirs() }
}

// Explicit opt-in genuine production-60s profile; never a routine test or skip.
tasks.register('realCompleteStorageBudgetAcceptance', JavaExec) {
    group = 'verification'
    description = 'Runs actual shared60s COMPLETE against real PG/RustFS/Clam/inspection, with labeled artificial transport delays.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.documentknowledge.documentmanagement.adapters.outbound.upload.RealCompleteStorageBudgetAcceptance'
    jvmArgs '-XX:ActiveProcessorCount=2'
    def authorityTmp = layout.buildDirectory.dir('authority-test-tmp')
    systemProperty 'java.io.tmpdir', authorityTmp.get().asFile.absolutePath
    doFirst {
        if (System.getenv('DKP_COMPLETE_DURATION_ACCEPTANCE') != 'required') {
            throw new GradleException('Explicit genuine storage duration profile is required')
        }
        authorityTmp.get().asFile.mkdirs()
    }
}
