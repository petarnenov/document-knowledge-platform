// Versioned HTTP adapter wiring follows contract generation; no public route is exposed yet.
dependencies {
    annotationProcessor platform(rootProject.libs.micronaut.platform)
    annotationProcessor 'io.micronaut:micronaut-inject-java'
    implementation platform(rootProject.libs.micronaut.platform)
    implementation 'io.micronaut:micronaut-http-server'
    implementation 'io.micronaut:micronaut-json-core'
    implementation 'tools.jackson.core:jackson-databind'
    testImplementation 'io.micronaut:micronaut-runtime'
    testImplementation 'io.micronaut:micronaut-http-server-netty'
    testImplementation 'io.micronaut:micronaut-jackson-databind'
}

// Keep real HTTP fixture pools separate from the real JDBC suite within the fixed CI PID budget.
tasks.named('test') { mustRunAfter ':services:dev-logging:adapters-out:test' }

// Isolate framework HTTP fixture classes; retain every test and the fixed runtime concurrency limits.
tasks.named('test') { maxParallelForks = 1; forkEvery = 1 }

// The two real 32-worker pools need their fixed PID envelope, without another test JVM sharing it.
tasks.named('test') {
    mustRunAfter ':modules:observability-support:test', ':modules:identity-contracts:test',
        ':modules:security-micronaut:test', ':modules:authorization-catalog:test', ':services:dev-logging:adapters-out:test'
}
