// Layer dependencies and verification are configured centrally.

// The CI bootstrap build must execute every new KB boundary floor (#191/#193).
tasks.named('check') {
    dependsOn ':services:browser-bff:application:knowledgeCoverageVerification',
            ':services:browser-bff:adapters-in:knowledgeCoverageVerification',
            ':services:browser-bff:adapters-out:knowledgeCoverageVerification'
}

// Physical socket-close ownership is a distinct changed source boundary (#193/#236).
tasks.register('knowledgeCoverageReport', JacocoReport) {
    dependsOn tasks.named('test')
    executionData layout.buildDirectory.file('jacoco/test.exec')
    sourceDirectories.from sourceSets.main.allSource.srcDirs
    classDirectories.from sourceSets.main.output.classesDirs.asFileTree.matching {
        include 'org/documentknowledge/browserbff/bootstrap/KnowledgeNettyTransportOwner*'
        include 'org/documentknowledge/browserbff/bootstrap/KnowledgeWireFactory*'
    }
    reports { xml.required = true; html.required = true }
}
tasks.register('knowledgeCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('knowledgeCoverageReport')
    executionData layout.buildDirectory.file('jacoco/test.exec')
    sourceDirectories.from sourceSets.main.allSource.srcDirs
    classDirectories.from sourceSets.main.output.classesDirs.asFileTree.matching {
        include 'org/documentknowledge/browserbff/bootstrap/KnowledgeNettyTransportOwner*'
        include 'org/documentknowledge/browserbff/bootstrap/KnowledgeWireFactory*'
    }
    violationRules { rule {
        limit { counter = 'LINE'; minimum = 0.75 }
        limit { counter = 'BRANCH'; minimum = 0.75 }
    } }
}
tasks.named('check') { dependsOn 'knowledgeCoverageVerification' }
