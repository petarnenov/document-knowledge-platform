micronaut.application.name=browser-bff
micronaut.server.port=8080
micronaut.server.host=0.0.0.0
micronaut.server.max-request-size=100000000
micronaut.server.max-request-buffer-size=16KB
micronaut.server.read-idle-timeout=30s
micronaut.server.write-idle-timeout=30s
micronaut.http.client.connect-timeout=2s
micronaut.http.client.read-timeout=3s
micronaut.http.client.follow-redirects=false
micronaut.http.client.max-content-length=65536
micronaut.server.netty.worker.threads=2
micronaut.server.netty.parent.threads=1
endpoints.all.enabled=false
micronaut.security.enabled=true
micronaut.security.authentication=session
micronaut.security.redirect.enabled=true
micronaut.security.redirect.unauthorized.enabled=false
micronaut.security.redirect.forbidden.enabled=false
micronaut.security.redirect.login-success=/
micronaut.security.redirect.login-failure=/?authentication=failed
micronaut.security.endpoints.login.enabled=false
micronaut.security.endpoints.logout.enabled=false
micronaut.security.token.bearer.enabled=false
micronaut.security.oauth2.clients.keycloak.enabled=${OIDC_ENABLED:false}
micronaut.security.oauth2.clients.keycloak.client-id=${OIDC_CLIENT_ID:dkp-bff}
micronaut.security.oauth2.clients.keycloak.client-secret=${OIDC_CLIENT_SECRET:}
micronaut.security.oauth2.clients.keycloak.openid.issuer=${OIDC_ISSUER:}
micronaut.security.oauth2.clients.keycloak.openid.authorization.code-challenge-method=S256
micronaut.security.oauth2.state.persistence=session
micronaut.security.oauth2.pkce.enabled=true
micronaut.security.oauth2.pkce.persistence=session
micronaut.security.oauth2.openid.nonce.persistence=session
micronaut.security.oauth2.openid.additional-claims.access-token=false
micronaut.security.oauth2.openid.additional-claims.refresh-token=false
micronaut.security.oauth2.openid.additional-claims.jwt=false
micronaut.security.oauth2.callback-uri=${OIDC_CALLBACK_URI:`https://localhost:18443/oauth/callback/keycloak`}
micronaut.security.csrf.enabled=true
# This BFF accepts CSRF only in its dedicated header; never parse an untrusted binary/JSON body for tokens.
micronaut.security.csrf.token-resolvers.field.enabled=false
micronaut.security.csrf.filter.regex-pattern=^/api/v1/(session/(tenant|logout)|dm/documents(?:/.*)?)$
micronaut.security.csrf.filter.content-types[0]=application/json
micronaut.security.csrf.filter.content-types[1]=application/octet-stream
micronaut.security.csrf.filter.methods[0]=POST
micronaut.security.csrf.filter.methods[1]=PATCH
micronaut.security.csrf.filter.methods[2]=PUT
micronaut.security.csrf.repositories.cookie.enabled=false
micronaut.session.http.cookie-name=__Host-DKP-SESSION
micronaut.session.http.cookie-secure=true
micronaut.session.http.cookie-same-site=Lax
micronaut.session.http.cookie-path=/
micronaut.session.http.base64-encode=false
micronaut.session.http.header=false
micronaut.session.max-inactive-interval=300s
micronaut.session.max-active-sessions=10000
micronaut.session.prompt-expiration=true
logger.levels.io.micronaut.security.token=INFO
logger.levels.io.micronaut.security.oauth2.endpoint.token.response.validation=OFF
logger.levels.io.micronaut.session=INFO
logger.levels.io.micronaut.security.session=OFF
dkp.bff.issuer=${OIDC_ISSUER:}
dkp.bff.client-id=${OIDC_CLIENT_ID:dkp-bff}
dkp.bff.profile=${OIDC_PROFILE:standalone}
dkp.bff.portal-origin=${DKP_PORTAL_ORIGIN:}
dkp.bff.upstreams.dm=${DKP_DM_URL:}
dkp.bff.upstreams.kb=${DKP_KB_URL:}
dkp.bff.upstreams.search=${DKP_SEARCH_URL:}

# Contract requires selectedTenant to be present even before selection.
jackson.serialization-inclusion=ALWAYS

# Uploaded and metadata request encodings are rejected by the public boundary; preserve headers and raw bytes.
micronaut.server.netty.request-decompression-enabled=false
