schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: Document Knowledge Platform, an independent public repository.
  Read AGENTS.md, docs/architecture/system-design.md and
  docs/development/worktree-workflow.md before proposing changes.
  Java 25 LTS, Micronaut, DDD and hexagonal dependency direction;
  React/Vite/strict TypeScript; independent domain builds and deployments.
  Selected design directions do not imply security or production acceptance.
  Work in isolated feature worktrees from origin/dev; PRs target dev.
  The user authorized automatic merge on 2026-10-31 after checks and review.
  The user authorized automatic specification approval on 2026-10-31;
  require independent specification review and validation before implementation.
  Preserve tenant isolation and fail-closed authorization in every environment.
  Never include credentials, private documents or employer/customer data.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
