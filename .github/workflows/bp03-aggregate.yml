name: BP03 aggregate ingress
on:
  workflow_dispatch:
  push:
    branches-ignore: [dev, main]
    paths:
      - 'services/browser-bff/**'
      - 'tools/ci/bp03-aggregate*'
      - 'tools/ci/test_bp03_aggregate_linux.py'
      - '.github/workflows/bp03-aggregate.yml'
permissions:
  contents: read
concurrency:
  group: bp03-aggregate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned controller self-check and coverage
        run: |
          docker build --platform linux/amd64 --iidfile "$RUNNER_TEMP/bp03-controller-image.id" -f tools/ci/bp03-aggregate-selftest.Dockerfile .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --memory 1g --cpus 2 --pids-limit 128 --tmpfs /tmp:rw,nosuid,nodev,noexec,uid=10001,gid=10001,mode=0700,size=128m "$(cat "$RUNNER_TEMP/bp03-controller-image.id")"
      - name: Shared isolated pinned Linux BFF checks
        run: >-
          python3 tools/ci/bp03-aggregate-linux.py run
          --source "$GITHUB_WORKSPACE" --evidence "$RUNNER_TEMP/bp03-aggregate"
      - name: Validate exact-source receipt and reports
        run: >-
          python3 tools/ci/bp03-aggregate-linux.py validate
          --source "$GITHUB_WORKSPACE" --evidence "$RUNNER_TEMP/bp03-aggregate"
      - name: Retain isolated test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bp03-aggregate-evidence
          path: ${{ runner.temp }}/bp03-aggregate
          if-no-files-found: error
