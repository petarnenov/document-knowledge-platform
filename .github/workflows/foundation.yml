name: Foundation
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          [document-management, knowledge-base, knowledge-search, browser-bff]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-daemon :services:${{ matrix.service }}:bootstrap:build
      - name: Real PostgreSQL role, CAS and restart coverage
        if: matrix.service == 'document-management'
        run: ./gradlew --no-daemon :services:document-management:adapters-out:persistenceCoverageVerification
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: java-${{ matrix.service }}
          path: services/${{ matrix.service }}/bootstrap/build/reports

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-daemon :modules:identity-contracts:check :modules:security-micronaut:check :modules:authorization-catalog:check architectureTest

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter admin-portal lint
      - run: pnpm --filter admin-portal typecheck
      - run: pnpm --filter admin-portal build
      - run: pnpm --filter admin-portal test:coverage
      - name: Shared real-browser acceptance helper coverage
        run: >-
          pnpm --filter admin-portal exec vitest run
          src/upload-fault-contract.test.tsx src/ui-create-receipt.test.tsx
          src/native-boundary-browser.test.tsx src/upload-job-fixture.test.tsx
          --coverage
          --coverage.include=e2e-real/upload-fault-contract.ts
          --coverage.include=e2e-real/ui-create-receipt.ts
          --coverage.include=e2e-real/native-boundary-browser.ts
          --coverage.include=e2e-real/upload-job-fixture.ts
          --coverage.reportsDirectory=coverage/acceptance-helpers
          --coverage.thresholds.lines=75 --coverage.thresholds.branches=75
          --coverage.thresholds.functions=75 --coverage.thresholds.statements=75
      - run: pnpm --filter admin-portal exec playwright install --with-deps chromium
      - run: pnpm --filter admin-portal test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: portal-reports
          path: |
            apps/admin-portal/coverage
            apps/admin-portal/playwright-report
            apps/admin-portal/test-results

  contracts-and-specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm openspec:check
      - run: pnpm dependencies:test
      - name: Reproducible public-lock SBOM source coverage
        run: >-
          node --experimental-test-coverage --test-coverage-lines=75
          --test-coverage-branches=75 --test-coverage-functions=75 --test
          tools/dependencies/bp03-sbom.test.mjs
      - name: Generate standard SBOM from public pinned dependency inputs
        run: node tools/dependencies/bp03-sbom.mjs . build/sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bp03-public-source-sbom
          if-no-files-found: error
          path: |
            build/sbom/bp03-source.cdx.json
            build/sbom/bp03-source-provenance.json
      - run: pnpm contracts:check
      - run: git diff --exit-code -- pnpm-lock.yaml generated-clients

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: node --experimental-test-coverage --test-coverage-lines=75 --test-coverage-branches=75 --test-coverage-functions=75 --test tools/runtime/identity-e2e.test.mjs
      - name: Fast versus real-time upload expiry selector
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=tools/runtime/upload-expiry.mjs
          --test-coverage-lines=75 --test-coverage-branches=75 --test-coverage-functions=75
          tools/runtime/upload-expiry.test.mjs
      - name: Verify private security bootstrap and runtime assertions
        run: |
          python3 -m venv /tmp/dkp-runtime-checks
          /tmp/dkp-runtime-checks/bin/pip install --disable-pip-version-check -r tools/runtime/requirements.txt
          /tmp/dkp-runtime-checks/bin/coverage run --branch -m unittest discover -s tools/runtime -p 'test_*.py'
          /tmp/dkp-runtime-checks/bin/coverage run --branch --append -m unittest discover -s infra/docker-compose -p 'test_*.py'
          /tmp/dkp-runtime-checks/bin/coverage report --include='*/smoke.py,*/bootstrap-security.py,*/identity-provider-check.py,*/document-database-check.py' --fail-under=75
      - name: Public SYSTEM Linux verification workspace
        run: |
          /tmp/dkp-runtime-checks/bin/coverage json --include='*/verification-workspace-system.py' -o /tmp/dkp-system-workspace-coverage.json
          python3 -c "import json; t=json.load(open('/tmp/dkp-system-workspace-coverage.json'))['totals']; assert t['num_statements'] > 0 and t['num_branches'] > 0; assert t['covered_lines']/t['num_statements'] >= 0.75 and t['covered_branches']/t['num_branches'] >= 0.75"
          docker pull eclipse-temurin:25.0.5_8-jdk@sha256:83f4a7fc27df94dcc7b8de04d14cbbba8da14406f921e966969c3b09000aa507
          python3 tools/runtime/verification-workspace-system.py
      - name: Public generic temporary-file Linux duration proof
        timeout-minutes: 12
        run: |
          JAVA_HOME="$(python3 - <<'PYTHON'
          import os
          from pathlib import Path
          try:
              home = Path(os.environ['JAVA_HOME'])
              if not home.is_absolute():
                  raise ValueError()
              home = home.resolve(strict=True)
              if not home.is_dir():
                  raise ValueError()
          except (KeyError, OSError, RuntimeError, ValueError):
              raise SystemExit('Trusted CI compiler home unavailable') from None
          print(home)
          PYTHON
          )"
          export JAVA_HOME
          /tmp/dkp-runtime-checks/bin/coverage json --include='*/generic-temp-system.py' -o /tmp/dkp-generic-system-coverage.json
          python3 -c "import json; t=json.load(open('/tmp/dkp-generic-system-coverage.json'))['totals']; assert t['num_statements'] > 0 and t['num_branches'] > 0; assert t['covered_lines']/t['num_statements'] >= 0.75 and t['covered_branches']/t['num_branches'] >= 0.75"
          python3 tools/runtime/generic-temp-system.py
      - run: python3 infra/docker-compose/bootstrap-security.py
      - run: docker compose --env-file local-data/security/runtime.env -f infra/docker-compose/compose.yaml config --quiet
      - run: docker compose --env-file local-data/security/runtime.env -f infra/docker-compose/compose.yaml up --build --wait --wait-timeout 240
      - run: /tmp/dkp-runtime-checks/bin/coverage run --branch --append tools/runtime/smoke.py
      - run: /tmp/dkp-runtime-checks/bin/coverage run --branch --append tools/runtime/identity-provider-check.py
      - run: /tmp/dkp-runtime-checks/bin/coverage run --branch --append tools/runtime/document-database-check.py
      - name: Real HTTPS identity and metadata draft browser journey
        run: node tools/runtime/identity-e2e.mjs
      - name: Real DM database outage, readiness and persistent restart
        run: /tmp/dkp-runtime-checks/bin/coverage run --branch --append tools/runtime/document-database-check.py --exercise-outage
      - run: docker compose --env-file local-data/security/runtime.env -f infra/docker-compose/compose.yaml down
        if: always()

  uploads:
    name: BP03 / real private upload providers and HTTPS journey
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Upload runner and actual Compose contract regressions
        run: >-
          node --experimental-test-coverage --test-coverage-lines=75
          --test-coverage-branches=75 --test-coverage-functions=75 --test
          tools/runtime/identity-e2e.test.mjs tools/runtime/compose-upload.test.mjs
          tools/runtime/provider-job-probe.test.mjs
      - name: Deterministic public synthetic document generator coverage
        run: >-
          node --experimental-test-coverage --test-coverage-lines=75
          --test-coverage-branches=75 --test-coverage-functions=75 --test
          tools/runtime/synthetic-documents.test.mjs
      - name: Strict per-helper source and branch coverage
        env:
          # Keep branch measurement consistent across Python versions. Python
          # 3.14 defaults to sysmon, which misses tested exception exits here.
          COVERAGE_CORE: ctrace
        run: |
          set -euo pipefail
          python3 -m venv /tmp/dkp-upload-checks
          /tmp/dkp-upload-checks/bin/pip install --disable-pip-version-check -r tools/runtime/requirements.txt
          /tmp/dkp-upload-checks/bin/coverage run --branch -m unittest discover -s tools/runtime -p 'test_*.py'
          /tmp/dkp-upload-checks/bin/coverage json -o /tmp/dkp-upload-helper-coverage.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/dkp-upload-helper-coverage.json'))
          for name in ('clam-definitions.py', 'rustfs-runtime.py', 'upload-runtime.py', 'upload-durability.py', 'upload-accounting-acceptance.py', 'upload-acceptance.py', 'upload-faults.py', 'provider-jobs.py', 'application-provenance.py', 'provider-job-control-acceptance.py'):
              matches = [v['summary'] for p, v in report['files'].items() if p.endswith('/' + name)]
              if len(matches) != 1:
                  raise SystemExit('Missing source coverage for ' + name)
              summary = matches[0]
              print(name + ': source ' + str(summary['covered_lines']) + '/' + str(summary['num_statements'])
                    + ', branches ' + str(summary['covered_branches']) + '/' + str(summary['num_branches']))
              if (summary['covered_lines'] / summary['num_statements'] < .75
                      or summary['num_branches'] == 0
                      or summary['covered_branches'] / summary['num_branches'] < .75):
                  raise SystemExit('Source/branch coverage below75% for ' + name)
              print(name + ': source and branch coverage PASS')
          PY
      - name: Genuine inspector tests and source coverage
        run: ./gradlew --no-daemon --max-workers=2 :workers:structure-inspector:check
      - name: Build pinned Linux real-provider test runtime
        run: |
          set -euo pipefail
          node tools/runtime/synthetic-documents.mjs
          cat > /tmp/dkp-upload-tests.Dockerfile <<'DOCKERFILE'
          FROM eclipse-temurin:25.0.5_8-jdk@sha256:83f4a7fc27df94dcc7b8de04d14cbbba8da14406f921e966969c3b09000aa507
          WORKDIR /workspace
          COPY --chown=10001:0 . .
          RUN chown 10001:0 /workspace && chmod 0755 /workspace && mkdir -p /tmp/dkp-gradle && chown 10001:0 /tmp/dkp-gradle
          ENV GRADLE_USER_HOME=/tmp/dkp-gradle
          USER 10001:0
          DOCKERFILE
          docker build -f /tmp/dkp-upload-tests.Dockerfile -t dkp-upload-ci-tests:local .
      - name: Real pinned RustFS TLS, native IAM and combined adapter coverage
        run: |
          set -euo pipefail
          python3 tools/runtime/rustfs-compat-harness.py prepare --directory local-data/security/bp03-ci-compat
          python3 tools/runtime/rustfs-compat-harness.py run --directory local-data/security/bp03-ci-compat --image dkp-upload-ci-tests:local
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as XML
          root = Path('local-data/security/bp03-ci-compat')
          reports = Path((root / 'latest-reports.private').read_text().strip())
          suites = [XML.parse(p).getroot() for p in (reports / 'junit').glob('TEST-*.xml')]
          if not suites or any(int(s.get(k, '0')) for s in suites for k in ('failures', 'errors', 'skipped')):
              raise SystemExit('Actual Linux adapter suite must pass with zero skips')
          provider = [s for s in suites if s.get('name', '').endswith('RustFsUploadStorageIntegrationTest')]
          if len(provider) != 1 or int(provider[0].get('tests', '0')) < 6:
              raise SystemExit('Missing mandatory real RustFS acceptance tests')
          print('Actual RustFS/combined adapter tests passed with zero skips')
          PY
      - name: Remove only owned compatibility fixture before full runtime
        if: always()
        run: |
          if test -f local-data/security/bp03-ci-compat/state.json; then
            python3 tools/runtime/rustfs-compat-harness.py cleanup --directory local-data/security/bp03-ci-compat
          fi
      - name: Start fresh BP03 with genuine recorded FreshClam generation
        run: python3 tools/runtime/upload-runtime.py start --directory local-data/security/bp03-upload/ci
      - name: Verify private providers, bounded health and runtime attestation
        run: python3 tools/runtime/upload-runtime.py verify --directory local-data/security/bp03-upload/ci
      - name: Real PostgreSQL synthetic accounting regression without business writes
        run: python3 tools/runtime/upload-accounting-acceptance.py --directory local-data/security/bp03-upload/ci
      - name: Seed a separate real HTTPS upload for quiescent durability checks
        run: >-
          node tools/runtime/identity-e2e.mjs --upload-durability-fixture
          --security-directory local-data/security/bp03-upload/ci/identity
          --runtime-env-file local-data/security/bp03-upload/ci/runtime.env
      - name: Actual owned provider faults and full upload-table durability
        run: |
          set -euo pipefail
          for service in pg rustfs scanner inspector dm; do
            python3 tools/runtime/upload-durability.py --directory local-data/security/bp03-upload/ci --exercise "$service" --wait-cleanup
          done
      - name: Real authenticated provider faults, both receipt states and retry accounting
        run: >-
          python3 tools/runtime/upload-faults.py
          --directory local-data/security/bp03-upload/authenticated-faults-ci
          --runtime-directory local-data/security/bp03-upload/ci
      - name: Real strict HTTPS four-format uploads and downloads in both themes
        run: >-
          node tools/runtime/identity-e2e.mjs --upload-runtime
          --security-directory local-data/security/bp03-upload/ci/identity
          --runtime-env-file local-data/security/bp03-upload/ci/runtime.env
      - name: Real combined PostgreSQL RustFS copy and deletion fence acceptance
        run: |
          set -euo pipefail
          python3 tools/runtime/rustfs-compat-harness.py prepare --directory local-data/security/bp03-ci-combined
          python3 tools/runtime/upload-acceptance.py prepare --directory local-data/security/upload-acceptance-ci --fixture-directory local-data/security/bp03-ci-combined --runtime-directory local-data/security/bp03-upload/ci
          dkp_acceptance_image=$(docker image inspect --format '{{.Id}}' dkp-upload-ci-tests:local)
          python3 tools/runtime/upload-acceptance.py run --directory local-data/security/upload-acceptance-ci --image "$dkp_acceptance_image"
          python3 tools/runtime/upload-acceptance.py run-storage-budget --directory local-data/security/upload-acceptance-ci --image "$dkp_acceptance_image"
      - name: Remove only the owned combined compatibility fixture
        if: always()
        run: |
          if test -f local-data/security/bp03-ci-combined/state.json; then
            python3 tools/runtime/rustfs-compat-harness.py cleanup --directory local-data/security/bp03-ci-combined
          fi
      - name: Release the owned main runtime before fresh quota acceptance
        run: python3 tools/runtime/upload-runtime.py stop --directory local-data/security/bp03-upload/ci
      - name: Start a separate fresh runtime for genuine quota acceptance
        run: python3 tools/runtime/upload-runtime.py start --directory local-data/security/bp03-upload/ci-quota
      - name: Verify the separate quota runtime
        run: python3 tools/runtime/upload-runtime.py verify --directory local-data/security/bp03-upload/ci-quota
      - name: Genuine concurrent quota admission and authorized UI recovery
        run: >-
          node tools/runtime/identity-e2e.mjs --upload-limits-profile quota
          --security-directory local-data/security/bp03-upload/ci-quota/identity
          --runtime-env-file local-data/security/bp03-upload/ci-quota/runtime.env
      - name: Release quota runtime before dedicated provider job acceptance
        run: python3 tools/runtime/upload-runtime.py stop --directory local-data/security/bp03-upload/ci-quota
      - name: Prepare exact private-control engine images
        run: python3 tools/runtime/provider-job-control-acceptance.py --prepare-images
      - name: Start dedicated fresh provider job runtime
        run: python3 tools/runtime/upload-runtime.py start --directory local-data/security/bp03-upload/ci-jobs
      - name: Verify dedicated fresh provider job runtime
        run: python3 tools/runtime/upload-runtime.py verify --directory local-data/security/bp03-upload/ci-jobs
      - name: Real owned scanner and inspector concurrency, guarded cancellation and DM crash
        run: >-
          python3 tools/runtime/provider-jobs.py
          --directory local-data/security/bp03-upload/provider-jobs-ci
          --runtime-directory local-data/security/bp03-upload/ci-jobs
      - name: Stop only recorded BP03 project resources
        if: always()
        run: |
          set -euo pipefail
          dkp_stop_status=0
          for directory in local-data/security/bp03-upload/ci local-data/security/bp03-upload/ci-quota local-data/security/bp03-upload/ci-jobs; do
            if test -f "$directory/state.json"; then
              if ! python3 tools/runtime/upload-runtime.py stop --directory "$directory"; then
                dkp_stop_status=1
              fi
            fi
          done
          exit "$dkp_stop_status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bp03-source-and-provider-reports
          path: |
            /tmp/dkp-upload-helper-coverage.json
            workers/structure-inspector/build/reports
            local-data/security/bp03-ci-compat/reports

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
      - name: Scan locked dependencies
        run: >-
          docker run --rm -v "$PWD:/workspace:ro"
          ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
          scan source --recursive /workspace
