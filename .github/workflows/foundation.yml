name: Foundation
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [document-management, knowledge-base, knowledge-search, browser-bff]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-daemon :services:${{ matrix.service }}:bootstrap:build
      - name: Real PostgreSQL role, CAS and restart coverage
        if: matrix.service == 'document-management'
        run: ./gradlew --no-daemon :services:document-management:adapters-out:persistenceCoverageVerification
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: java-${{ matrix.service }}
          path: services/${{ matrix.service }}/bootstrap/build/reports

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-daemon :modules:identity-contracts:check :modules:security-micronaut:check :modules:authorization-catalog:check architectureTest

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter admin-portal lint
      - run: pnpm --filter admin-portal typecheck
      - run: pnpm --filter admin-portal build
      - run: pnpm --filter admin-portal test:coverage
      - run: pnpm --filter admin-portal exec playwright install --with-deps chromium
      - run: pnpm --filter admin-portal test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: portal-reports
          path: |
            apps/admin-portal/coverage
            apps/admin-portal/playwright-report
            apps/admin-portal/test-results

  contracts-and-specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm openspec:check
      - run: pnpm dependencies:test
      - run: pnpm contracts:check
      - run: git diff --exit-code -- pnpm-lock.yaml generated-clients

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: node --experimental-test-coverage --test-coverage-lines=75 --test-coverage-branches=75 --test-coverage-functions=75 --test tools/runtime/identity-e2e.test.mjs
      - name: Verify private security bootstrap and runtime assertions
        run: |
          python3 -m venv /tmp/dkp-runtime-checks
          /tmp/dkp-runtime-checks/bin/pip install --disable-pip-version-check -r tools/runtime/requirements.txt
          /tmp/dkp-runtime-checks/bin/coverage run --branch -m unittest discover -s tools/runtime -p 'test_*.py'
          /tmp/dkp-runtime-checks/bin/coverage run --branch --append -m unittest discover -s infra/docker-compose -p 'test_*.py'
          /tmp/dkp-runtime-checks/bin/coverage report --include='*/smoke.py,*/bootstrap-security.py,*/identity-provider-check.py,*/document-database-check.py' --fail-under=75
      - run: python3 infra/docker-compose/bootstrap-security.py
      - run: docker compose --env-file local-data/security/runtime.env -f infra/docker-compose/compose.yaml config --quiet
      - run: docker compose --env-file local-data/security/runtime.env -f infra/docker-compose/compose.yaml up --build --wait --wait-timeout 240
      - run: /tmp/dkp-runtime-checks/bin/coverage run --branch --append tools/runtime/smoke.py
      - run: /tmp/dkp-runtime-checks/bin/coverage run --branch --append tools/runtime/identity-provider-check.py
      - run: /tmp/dkp-runtime-checks/bin/coverage run --branch --append tools/runtime/document-database-check.py
      - name: Real HTTPS identity and metadata draft browser journey
        run: node tools/runtime/identity-e2e.mjs
      - name: Real DM database outage, readiness and persistent restart
        run: /tmp/dkp-runtime-checks/bin/coverage run --branch --append tools/runtime/document-database-check.py --exercise-outage
      - run: docker compose --env-file local-data/security/runtime.env -f infra/docker-compose/compose.yaml down
        if: always()

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
      - name: Scan locked dependencies
        run: >-
          docker run --rm -v "$PWD:/workspace:ro"
          ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
          scan source --recursive /workspace
