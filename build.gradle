import org.gradle.api.artifacts.ProjectDependency

plugins { id 'base' }

group = 'org.documentknowledge'
version = '0.1.0-SNAPSHOT'

def serviceNames = ['document-management', 'knowledge-base', 'knowledge-search', 'browser-bff']
def layerNames = ['domain', 'application', 'adapters-in', 'adapters-out', 'bootstrap']

subprojects {
    if (name in layerNames || name in ['architecture-tests', 'identity-contracts', 'security-micronaut', 'authorization-catalog', 'structure-inspector']) {
        apply plugin: 'java-library'
        apply plugin: 'jacoco'
        // Gradle resolves components by group/name/version, so repeated layer names
        // need service-specific coordinates to preserve every independent service.
        group = name in layerNames ? "${rootProject.group}.${parent.name.replace('-', '')}" : rootProject.group
        version = rootProject.version
        repositories { mavenCentral() }
        java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 25
        }
        jacoco { toolVersion = rootProject.libs.versions.jacoco.get() }
        dependencyLocking {
            lockAllConfigurations()
            lockMode = LockMode.STRICT
        }
        configurations.configureEach {
            incoming.beforeResolve {
                dependencies.withType(ExternalModuleDependency).each { dependency ->
                    def requested = dependency.version
                    if (requested != null && (requested.contains('+') || requested.contains('[') || requested.contains('(') || requested.startsWith('latest.') || requested.endsWith('-SNAPSHOT'))) {
                        throw new GradleException("Floating dependency version forbidden: ${dependency}")
                    }
                }
            }
        }
        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            maxParallelForks = 1
            jvmArgs '-XX:ActiveProcessorCount=2'
            testLogging { events 'failed', 'skipped' }
        }
        if (name in layerNames || name == 'structure-inspector') {
            dependencies {
                testImplementation platform(rootProject.libs.micronaut.platform)
                testImplementation 'org.junit.jupiter:junit-jupiter'
                testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
            }
        }
        tasks.withType(Jar).configureEach {
            preserveFileTimestamps = false
            reproducibleFileOrder = true
        }
    }
}

serviceNames.each { service ->
    def base = ":services:${service}"
    project("${base}:application") { dependencies { api project("${base}:domain") } }
    if (service == 'document-management') {
        project("${base}:application") { dependencies { api project(':modules:identity-contracts') } }
        project("${base}:adapters-in") {
            dependencies {
                implementation 'io.micronaut:micronaut-jackson-databind'
                implementation 'io.micronaut:micronaut-http-server'
            }
        }
        project("${base}:adapters-out") {
            dependencies {
                implementation project(':modules:authorization-catalog')
                implementation platform(rootProject.libs.micronaut.platform)
                implementation 'tools.jackson.core:jackson-databind'
                implementation("software.amazon.awssdk:s3:${rootProject.libs.versions.aws.sdk.get()}") {
                    exclude group: 'software.amazon.awssdk', module: 'apache-client'
                    exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
                }
                implementation "software.amazon.awssdk:apache5-client:${rootProject.libs.versions.aws.sdk.get()}"
                testImplementation "software.amazon.awssdk:url-connection-client:${rootProject.libs.versions.aws.sdk.get()}"
                testImplementation "org.testcontainers:testcontainers-postgresql:${rootProject.libs.versions.testcontainers.get()}"
                testImplementation "org.flywaydb:flyway-core:${rootProject.libs.versions.flyway.get()}"
                testRuntimeOnly "org.flywaydb:flyway-database-postgresql:${rootProject.libs.versions.flyway.get()}"
                testImplementation "org.postgresql:postgresql:${rootProject.libs.versions.postgresql.jdbc.get()}"
                testImplementation project(':workers:structure-inspector')
            }
        }
        project("${base}:bootstrap") {
            dependencies {
                implementation project(':modules:authorization-catalog')
                implementation 'io.micronaut.sql:micronaut-jdbc-hikari'
                implementation 'io.micronaut.flyway:micronaut-flyway'
                implementation "org.flywaydb:flyway-core:${rootProject.libs.versions.flyway.get()}"
                runtimeOnly "org.flywaydb:flyway-database-postgresql:${rootProject.libs.versions.flyway.get()}"
                runtimeOnly "org.postgresql:postgresql:${rootProject.libs.versions.postgresql.jdbc.get()}"
                testImplementation "org.postgresql:postgresql:${rootProject.libs.versions.postgresql.jdbc.get()}"
                testImplementation "org.testcontainers:testcontainers-postgresql:${rootProject.libs.versions.testcontainers.get()}"
                testImplementation "org.flywaydb:flyway-database-postgresql:${rootProject.libs.versions.flyway.get()}"
            }
        }
    }
    ['adapters-in', 'adapters-out'].each { layer ->
        project("${base}:${layer}") {
            dependencies { implementation project("${base}:application") }
        }
    }
    project("${base}:adapters-in") {
        dependencies {
            annotationProcessor platform(rootProject.libs.micronaut.platform)
            annotationProcessor 'io.micronaut:micronaut-inject-java'
            implementation platform(rootProject.libs.micronaut.platform)
            implementation 'io.micronaut:micronaut-http'
            implementation 'io.micronaut.security:micronaut-security'
            implementation project(':modules:identity-contracts')
            if (service != 'browser-bff') implementation project(':modules:security-micronaut')
            implementation 'jakarta.inject:jakarta.inject-api'
        }
    }
    if (service == 'browser-bff') {
        ['adapters-in', 'adapters-out'].each { layer ->
            project("${base}:${layer}") {
                dependencies {
                    annotationProcessor platform(rootProject.libs.micronaut.platform)
                    annotationProcessor 'io.micronaut:micronaut-inject-java'
                    implementation platform(rootProject.libs.micronaut.platform)
                    implementation 'jakarta.inject:jakarta.inject-api'
                    implementation 'io.micronaut:micronaut-jackson-databind'
                    if (layer == 'adapters-in') implementation 'io.micronaut:micronaut-http-server'
                }
            }
        }
        project("${base}:adapters-in") {
            dependencies {
                implementation 'io.micronaut.security:micronaut-security-oauth2'
                implementation 'io.micronaut.security:micronaut-security-session'
                implementation 'io.micronaut.security:micronaut-security-csrf'
                implementation 'io.micronaut.session:micronaut-session'
                implementation 'io.projectreactor:reactor-core'
            }
        }
    }
    project("${base}:bootstrap") {
        apply plugin: 'application'
        dependencies {
            annotationProcessor platform(rootProject.libs.micronaut.platform)
            annotationProcessor 'io.micronaut:micronaut-inject-java'
            implementation platform(rootProject.libs.micronaut.platform)
            implementation project("${base}:application")
            implementation project("${base}:adapters-in")
            implementation project("${base}:adapters-out")
            implementation 'io.micronaut:micronaut-runtime'
            implementation 'io.micronaut:micronaut-http-server-netty'
            implementation 'io.micronaut:micronaut-jackson-databind'
            implementation 'io.micronaut:micronaut-http-client'
            implementation 'io.micronaut.security:micronaut-security-jwt'
            implementation project(':modules:identity-contracts')
            if (service != 'browser-bff') implementation project(':modules:security-micronaut')
            if (service == 'browser-bff') {
                implementation 'io.micronaut.security:micronaut-security-oauth2'
                implementation 'io.micronaut.security:micronaut-security-session'
                implementation 'io.micronaut.security:micronaut-security-csrf'
                implementation 'io.micronaut.session:micronaut-session'
                testImplementation 'io.micronaut.security:micronaut-security-oauth2'
                testImplementation 'io.micronaut.security:micronaut-security-session'
                testImplementation 'io.micronaut.security:micronaut-security-csrf'
                testImplementation 'io.micronaut.session:micronaut-session'
            }
            runtimeOnly 'ch.qos.logback:logback-classic'
            testAnnotationProcessor platform(rootProject.libs.micronaut.platform)
            testAnnotationProcessor 'io.micronaut:micronaut-inject-java'
            testImplementation platform(rootProject.libs.micronaut.platform)
            testImplementation 'org.junit.jupiter:junit-jupiter'
            testImplementation 'io.projectreactor:reactor-core'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
        application {
            mainClass = "org.documentknowledge.${service.replace('-', '')}.bootstrap.Application"
            applicationName = service
        }
        tasks.named('build') { dependsOn 'installDist', 'serviceCoverageVerification' }
        def coveredProjects = layerNames.collect { project("${base}:${it}") }
        tasks.register('serviceCoverageReport', JacocoReport) {
            dependsOn coveredProjects.collect { it.tasks.named('test') }
            executionData.from coveredProjects.collect { it.layout.buildDirectory.file('jacoco/test.exec') }
            sourceDirectories.from coveredProjects.collect { it.sourceSets.main.allSource.srcDirs }
            classDirectories.from coveredProjects.collect { it.sourceSets.main.output.classesDirs }
            reports { xml.required = true; html.required = true }
        }
        tasks.register('serviceCoverageVerification', JacocoCoverageVerification) {
            dependsOn tasks.named('serviceCoverageReport')
            executionData.from coveredProjects.collect { it.layout.buildDirectory.file('jacoco/test.exec') }
            sourceDirectories.from coveredProjects.collect { it.sourceSets.main.allSource.srcDirs }
            classDirectories.from coveredProjects.collect { it.sourceSets.main.output.classesDirs }
            violationRules {
                rule {
                    limit { counter = 'LINE'; minimum = 0.75 }
                    limit { counter = 'BRANCH'; minimum = 0.75 }
                }
            }
        }
        tasks.named('check') { dependsOn 'serviceCoverageVerification' }
    }
}

// Validate project declarations as well as compiled class dependencies.
def allowedLayerDependency = { String from, String target ->
    def f = from.tokenize(':'); def t = target.tokenize(':')
    if (target == ':modules:identity-contracts') return from.startsWith(':services:') || from in [':modules:security-micronaut', ':modules:authorization-catalog']
    if (target == ':modules:authorization-catalog') return from in [':services:document-management:adapters-out', ':services:document-management:bootstrap']
    if (target == ':modules:security-micronaut') return f.size() == 3 && f[0] == 'services' && f[2] in ['adapters-in', 'adapters-out', 'bootstrap']
    if (f.size() != 3 || t.size() != 3 || f[0] != 'services' || t[0] != 'services') return false
    if (f[1] != t[1]) return false
    def allowed = [domain: [], application: ['domain'], 'adapters-in': ['application', 'domain'],
                   'adapters-out': ['application', 'domain'], bootstrap: ['domain', 'application', 'adapters-in', 'adapters-out']]
    allowed[f[2]].contains(t[2])
}

def serviceProjects = serviceNames.collectMany { service ->
    layerNames.collect { layer -> project(":services:${service}:${layer}") }
}
tasks.register('architectureDependencyTest') {
    group = 'verification'
    description = 'Verifies the declared service dependency graph and its negative fixtures.'
    doLast {
        assert allowedLayerDependency(':services:document-management:application', ':services:document-management:domain')
        assert !allowedLayerDependency(':services:document-management:domain', ':services:document-management:bootstrap')
        assert !allowedLayerDependency(':services:document-management:application', ':services:document-management:adapters-in')
        assert !allowedLayerDependency(':services:document-management:bootstrap', ':services:knowledge-base:domain')
        assert allowedLayerDependency(':services:browser-bff:application', ':modules:identity-contracts')
        assert !allowedLayerDependency(':services:browser-bff:domain', ':modules:security-micronaut')
        assert !allowedLayerDependency(':modules:identity-contracts', ':modules:security-micronaut')
        assert allowedLayerDependency(':modules:authorization-catalog', ':modules:identity-contracts')
        assert allowedLayerDependency(':services:document-management:adapters-out', ':modules:authorization-catalog')
        assert !allowedLayerDependency(':services:document-management:application', ':modules:authorization-catalog')
        assert !allowedLayerDependency(':services:knowledge-base:adapters-out', ':modules:authorization-catalog')
        assert !allowedLayerDependency(':workers:structure-inspector', ':services:document-management:application')
        assert !allowedLayerDependency(':services:document-management:application', ':workers:structure-inspector')
        (serviceProjects + [project(':modules:identity-contracts'), project(':modules:security-micronaut'), project(':modules:authorization-catalog'), project(':workers:structure-inspector')]).each { p ->
                def layer = p.name
                p.configurations.matching { it.name in ['api', 'implementation', 'compileOnly', 'runtimeOnly'] }.each { config ->
                    config.dependencies.each { dependency ->
                        if (dependency instanceof ProjectDependency) {
                            if (!allowedLayerDependency(p.path, dependency.path)) {
                                throw new GradleException("Forbidden project dependency: ${p.path} -> ${dependency.path}")
                            }
                        } else if (layer in ['domain', 'application', 'identity-contracts']) {
                            throw new GradleException("External production dependency forbidden in ${p.path}: ${dependency}")
                        }
                    }
                }
        }
    }
}

tasks.register('architectureTest') {
    group = 'verification'
    dependsOn 'architectureDependencyTest', ':architecture-tests:test'
}
tasks.named('check') { dependsOn 'architectureTest' }
subprojects {
    plugins.withId('java') {
        def projectConfigurations = configurations
        tasks.register('resolveAndLockAll') {
            description = 'Resolves this project dependency configurations; invoke with --write-locks.'
            doLast {
                projectConfigurations.matching { it.canBeResolved }.each { it.resolve() }
            }
        }
    }
}
tasks.register('resolveAndLockAll') {
    description = 'Resolves all Java projects under their own project locks; invoke with --write-locks.'
    dependsOn { subprojects.collect { it.tasks.findByName('resolveAndLockAll') }.findAll { it != null } }
}
