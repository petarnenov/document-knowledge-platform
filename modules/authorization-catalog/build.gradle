dependencies {
    api platform(rootProject.libs.micronaut.platform)
    api project(':modules:identity-contracts')
    implementation 'tools.jackson.core:jackson-databind'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { finalizedBy 'jacocoTestReport' }
tasks.named('jacocoTestReport') { reports { xml.required = true; html.required = true } }
tasks.named('jacocoTestCoverageVerification') {
    dependsOn 'test'
    violationRules { rule { limit { counter = 'LINE'; minimum = 0.75 }; limit { counter = 'BRANCH'; minimum = 0.75 } } }
}
tasks.named('check') { dependsOn 'jacocoTestCoverageVerification' }

// /tmp and other shared writable ancestors intentionally cannot host authority fixtures.
tasks.named('test') {
    def authorityTmp = layout.buildDirectory.dir('authority-test-tmp')
    systemProperty 'java.io.tmpdir', authorityTmp.get().asFile.absolutePath
    doFirst { authorityTmp.get().asFile.mkdirs() }
}
